<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Match 3</title>
<style>
  :root {
    --bg: #eef2fb;
    --card: #ffffff;
    --border: #d7deee;
    --text: #1e2740;
    --muted: #6b7592;
    --accent: #6366f1;
    --good: #16a34a;
    --danger: #e11d48;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    padding: 20px 12px 48px;
    background: radial-gradient(120% 120% at 50% 0%, #ffffff 0%, var(--bg) 62%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }

  h1 { margin: 0 0 4px; font-size: 27px; letter-spacing: -.02em; }
  .tip { margin: 0 0 16px; font-size: 13px; color: var(--muted); text-align: center; max-width: 460px; }

  .panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 14px;
    box-shadow: 0 10px 30px rgba(30,39,64,.10);
    width: min(440px, 100%);
  }

  .bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 7px;
    margin-bottom: 10px;
  }
  .bar:last-child { margin-bottom: 0; margin-top: 10px; }

  .stat {
    background: #f5f7fd;
    color: #3a4668;
    font-family: "SFMono-Regular", Menlo, Consolas, monospace;
    font-size: 12px;
    font-weight: 700;
    padding: 5px 9px;
    border-radius: 9px;
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 5px;
    white-space: nowrap;
  }
  .stat small { font-weight: 400; opacity: .7; font-size: 11px; }
  .stat b { color: var(--accent); }

  select {
    font-family: inherit;
    font-size: 13px;
    color: var(--text);
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 7px 9px;
    cursor: pointer;
  }
  select:disabled { opacity: .5; cursor: not-allowed; }

  button {
    font-family: inherit;
    font-size: 13px;
    color: var(--text);
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 8px 14px;
    cursor: pointer;
    transition: border-color .12s ease, color .12s ease, background .12s ease, filter .12s ease;
  }
  button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.primary {
    background: linear-gradient(160deg, #818cf8, #4f46e5);
    border-color: #4f46e5;
    color: #fff;
    font-weight: 700;
  }
  button.primary:hover:not(:disabled) { color: #fff; filter: brightness(1.06); }

  /* ---------- board ---------- */
  /* The wrapper gives the decoration layer a positioned box that exactly
   * overlays the board, so particles and floating scores can live OUTSIDE
   * `#board` (its classed children are treated as tiles by the harness). */
  .board-wrap {
    position: relative;
    width: 100%;
    /* Cell stride helpers — a cell is `(100% + gap)` wide, which is what the
     * slide / drop keyframes multiply by. Declared on the wrapper so BOTH the
     * board (tile grid) and the decoration layer inherit them. */
    --gap: 6px;
    --pad: 8px;
    --clear-ms: 320ms;
  }

  #board {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: var(--gap);
    width: 100%;
    aspect-ratio: 1 / 1;
    padding: var(--pad);
    border-radius: 16px;
    background: linear-gradient(180deg, #f3f6fe, #e9eefb);
    border: 1px solid var(--border);
    box-shadow: inset 0 2px 10px rgba(30,39,64,.07);
    touch-action: none;
    user-select: none;
    overflow: hidden;
  }

  /* Decoration layer: a grid mirroring the board's geometry, sitting on top of
   * it. Anchors are placed with grid-row / grid-column so a particle burst is
   * pixel-aligned with its tile without reading any layout back. */
  #fxLayer {
    position: absolute;
    inset: 0;
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(8, 1fr);
    gap: var(--gap, 6px);
    padding: var(--pad, 8px);
    pointer-events: none;
    z-index: 8;
    overflow: visible;
  }

  .cell {
    position: relative;              /* anchor for the ::before / ::after fx */
    border-radius: 10px;
    background: #e2e8f5;
    box-shadow: inset 0 1px 3px rgba(30,39,64,.12);
    cursor: pointer;
    transition: transform .12s ease, filter .12s ease, opacity .12s ease;
    will-change: transform, opacity;
  }
  .cell.empty {
    background: #e7ecf6;
    box-shadow: inset 0 1px 4px rgba(30,39,64,.10);
    cursor: default;
  }
  /* The selected look deliberately uses NO transform: a running slide / drop
   * animation owns `transform`, and an animation always beats a static
   * declaration, so `scale(.9)` here would make a selected gem "jump" the
   * moment it starts moving. An inset ring + glow conveys selection instead. */
  .cell.sel {
    outline: 3px solid var(--accent);
    outline-offset: -3px;
    box-shadow: inset 0 0 0 3px rgba(99,102,241,.55), 0 0 10px rgba(99,102,241,.40);
    filter: brightness(1.08);
    z-index: 3;
  }

  /* gem colours (7-slot palette, indexed by colour) */
  .cell.c0 { background: radial-gradient(circle at 32% 28%, #fda4af, #f43f5e 72%); }
  .cell.c1 { background: radial-gradient(circle at 32% 28%, #fcd34d, #f59e0b 72%); }
  .cell.c2 { background: radial-gradient(circle at 32% 28%, #86efac, #22c55e 72%); }
  .cell.c3 { background: radial-gradient(circle at 32% 28%, #93c5fd, #3b82f6 72%); }
  .cell.c4 { background: radial-gradient(circle at 32% 28%, #d8b4fe, #a855f7 72%); }
  .cell.c5 { background: radial-gradient(circle at 32% 28%, #67e8f9, #06b6d4 72%); }
  .cell.c6 { background: radial-gradient(circle at 32% 28%, #f9a8d4, #ec4899 72%); }

  /* Transient phase animations. Each class only names the animation; the
   * distance travelled is passed per cell through --fx-* custom properties so
   * one keyframe drives every swap / drop. */
  .cell.swap { animation: swapSlide var(--fx-ms, 190ms) cubic-bezier(.22,.72,.24,1) both; z-index: 4; }
  .cell.bad  { animation: shake .18s ease; }
  .cell.clear{ animation: clearBurst var(--clear-ms, 320ms) cubic-bezier(.3,.9,.3,1) both; z-index: 6; }
  .cell.fall { animation: fallDrop  var(--fx-ms, 300ms) cubic-bezier(.3,.05,.35,1.25) both; z-index: 4; }
  .cell.drop { animation: refillDrop var(--fx-ms, 220ms) cubic-bezier(.3,.05,.35,1.25) both; z-index: 4; }
  .cell.hint { animation: hintPulse .6s ease 2; }

  /* White flash + expanding ring for a cleared gem, drawn as pseudo-elements so
   * the tile keeps its colour class and its own `transform`. */
  .cell.clear::before,
  .cell.clear::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    pointer-events: none;
  }
  .cell.clear::before {
    background: radial-gradient(circle, rgba(255,255,255,.95) 0%, rgba(255,255,255,0) 68%);
    animation: clearFlash var(--clear-ms, 320ms) ease-out both;
  }
  .cell.clear::after {
    border: 2px solid rgba(255,255,255,.92);
    animation: clearRing var(--clear-ms, 320ms) ease-out both;
  }

  /* Swap: the two tiles start on each other's square and slide home, so the
   * gems visibly cross over instead of blinking to a new colour. */
  @keyframes swapSlide {
    0%   { transform: translate(calc(var(--fx-nx, 0) * (100% + var(--gap))),
                                calc(var(--fx-ny, 0) * (100% + var(--gap)))); }
    100% { transform: translate(0, 0); }
  }
  /* Clear: a bright pop, then a shrinking, rotating fade-out. */
  @keyframes clearBurst {
    0%   { transform: scale(1) rotate(0deg);      filter: brightness(1)   saturate(1);   opacity: 1; }
    30%  { transform: scale(1.2) rotate(0deg);    filter: brightness(1.75) saturate(1.4); opacity: 1; }
    62%  { transform: scale(1.06) rotate(8deg);   filter: brightness(1.85) saturate(1.5); opacity: .95; }
    100% { transform: scale(.25) rotate(22deg);   filter: brightness(2)   saturate(1.5); opacity: 0; }
  }
  @keyframes clearFlash {
    0%   { opacity: 0; }
    22%  { opacity: .78; }
    100% { opacity: 0; }
  }
  @keyframes clearRing {
    0%   { transform: scale(1);   opacity: .95; }
    100% { transform: scale(2.1); opacity: 0; }
  }
  /* Gravity: accelerate down, then squash on landing and settle back. */
  @keyframes fallDrop {
    0%   { transform: translateY(calc(var(--fx-ny, 0) * (100% + var(--gap)))); }
    78%  { transform: translateY(0) scaleY(1); }
    88%  { transform: translateY(0) scale(1.14, .86); }
    96%  { transform: translateY(0) scale(.96, 1.05); }
    100% { transform: translateY(0) scale(1); }
  }
  /* Refill: same fall, but the new gems also fade in as they enter. */
  @keyframes refillDrop {
    0%   { transform: translateY(calc(var(--fx-ny, 0) * (100% + var(--gap)))); opacity: 0; }
    18%  { opacity: 1; }
    78%  { transform: translateY(0) scaleY(1); opacity: 1; }
    88%  { transform: translateY(0) scale(1.12, .88); }
    100% { transform: translateY(0) scale(1); }
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25%      { transform: translateX(-3px); }
    75%      { transform: translateX(3px); }
  }
  @keyframes hintPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(99,102,241,0); }
    50%      { box-shadow: 0 0 0 4px rgba(99,102,241,.55); }
  }

  /* ---------- decoration layer ---------- */
  .fx-anchor { position: relative; pointer-events: none; }
  .fx-anchor.fx-full { grid-row: 1 / -1; grid-column: 1 / -1; }

  .fx-ring {
    position: absolute;
    inset: 0;
    border-radius: 10px;
    border: 2px solid rgba(255,255,255,.95);
    animation: fxRing .42s ease-out both;
    pointer-events: none;
  }
  @keyframes fxRing {
    0%   { transform: scale(.65); opacity: .9; }
    100% { transform: scale(2.4); opacity: 0; }
  }

  .fx-spark {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 7px;
    height: 7px;
    margin: -3.5px 0 0 -3.5px;
    border-radius: 50%;
    /* A bright core so a spark reads as light, tinted by the gem it came from. */
    background: radial-gradient(circle, #ffffff 0%, #ffffff 45%, var(--spark, #ffffff) 100%);
    box-shadow: 0 0 8px 1px var(--spark, #ffffff);
    animation: fxSpark .46s cubic-bezier(.2,.7,.4,1) both;
    pointer-events: none;
  }
  @keyframes fxSpark {
    0%   { transform: translate(0, 0) scale(.45); opacity: 1; }
    100% { transform: translate(calc(var(--sx, 0) * var(--spread, 30px)),
                                calc(var(--sy, 0) * var(--spread, 30px))) scale(0);
           opacity: 0; }
  }

  .fx-float {
    position: absolute;
    left: 50%;
    top: 50%;
    font: 700 13px/1 "SFMono-Regular", Menlo, Consolas, monospace;
    color: #fff;
    text-shadow: 0 1px 3px rgba(20,27,48,.65);
    white-space: nowrap;
    animation: fxFloat .8s ease-out both;
    pointer-events: none;
  }
  @keyframes fxFloat {
    0%   { transform: translate(-50%, -50%) scale(.7);   opacity: 0; }
    25%  { transform: translate(-50%, -60%) scale(1.06); opacity: 1; }
    100% { transform: translate(-50%, -125%) scale(1);   opacity: 0; }
  }

  .fx-combo {
    position: absolute;
    left: 50%;
    top: 50%;
    font: 800 40px/1 "SFMono-Regular", Menlo, Consolas, monospace;
    color: #fff;
    text-shadow: 0 3px 14px rgba(79,70,229,.75), 0 1px 2px rgba(20,27,48,.45);
    animation: fxCombo .9s cubic-bezier(.2,1.4,.4,1) both;
    pointer-events: none;
  }
  @keyframes fxCombo {
    0%   { transform: translate(-50%, -50%) scale(.4);  opacity: 0; }
    30%  { transform: translate(-50%, -50%) scale(1.25); opacity: 1; }
    55%  { transform: translate(-50%, -50%) scale(1);    opacity: 1; }
    100% { transform: translate(-50%, -58%) scale(1);    opacity: 0; }
  }

  #board.shake { animation: boardShake .24s ease-out; }
  @keyframes boardShake {
    0%, 100% { transform: translate(0, 0); }
    25%      { transform: translate(-2px, 1px); }
    50%      { transform: translate(2px, -1px); }
    75%      { transform: translate(-1px, 1px); }
  }

  /* Respect the platform motion preference: keep the flow identical but make
   * every decorative animation effectively instantaneous. Cleanup is driven by
   * the JS clock, never by animation events, so nothing leaks. */
  @media (prefers-reduced-motion: reduce) {
    .cell.swap, .cell.fall, .cell.drop, .cell.clear,
    .cell.clear::before, .cell.clear::after,
    .fx-ring, .fx-spark, .fx-float, .fx-combo {
      animation-duration: 1ms !important;
      animation-iteration-count: 1 !important;
    }
    #board.shake { animation: none !important; }
  }

  .notice {
    margin: 10px 2px 0;
    min-height: 18px;
    text-align: center;
    font-size: 12px;
    color: var(--muted);
  }

  /* ---------- overlays ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(20, 27, 48, .42);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 20;
  }
  .overlay.show { display: flex; }

  .dialog {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 26px 28px 22px;
    width: min(360px, 100%);
    text-align: center;
    box-shadow: 0 16px 50px rgba(20,27,48,.30);
    animation: rise .2s ease-out;
  }
  @keyframes rise {
    from { transform: translateY(12px); opacity: 0; }
    to   { transform: translateY(0);    opacity: 1; }
  }

  .dialog h2 { margin: 0 0 10px; font-size: 22px; }
  .dialog p  { color: var(--muted); font-size: 13px; line-height: 1.65; margin: 0 0 18px; }
  #dlgSub {
    font-family: "SFMono-Regular", Menlo, Consolas, monospace;
    font-size: 13px;
  }
  .dialog kbd {
    display: inline-block;
    min-width: 16px;
    padding: 1px 6px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text);
    background: #f5f7fd;
    border: 1px solid var(--border);
    border-bottom-width: 2px;
    border-radius: 5px;
  }
  .dialog b { color: var(--accent); }

  .field {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin: 0 0 18px;
    font-size: 13px;
    color: var(--muted);
  }

  @media (max-width: 480px) {
    h1 { font-size: 22px; }
    .panel { padding: 11px; }
    .bar { gap: 5px; }
    .board-wrap { --gap: 4px; --pad: 6px; }
    button { padding: 7px 11px; font-size: 12px; }
    .stat { padding: 4px 7px; font-size: 11px; }
  }
</style>
</head>
<body>

<div class="lang-switch" data-lang-switch></div>

<h1 data-i18n="title"></h1>
<p class="tip" data-i18n="tip"></p>

<div class="panel">
  <div class="bar">
    <span class="stat"><small data-i18n="score"></small> <b id="score">0</b></span>
    <span class="stat"><small data-i18n="moves"></small> <b id="moves">0</b></span>
    <span class="stat"><small data-i18n="target"></small> <b id="target">0</b></span>
    <span class="stat"><small data-i18n="best"></small> <b id="best">0</b></span>
    <span class="stat"><small data-i18n="combo"></small> <b id="combo">-</b></span>
    <span class="stat"><small data-i18n="level"></small> <b id="levelLabel">Normal</b></span>
  </div>

  <div class="board-wrap">
    <div id="board"></div>
    <div id="fxLayer"></div>
  </div>

  <div class="bar">
    <button id="btnHint" data-i18n="hint"></button>
    <button id="btnShuffle" data-i18n="shuffle"></button>
    <button id="btnNew" data-i18n="newgame"></button>
  </div>
  <p class="notice" id="notice"></p>
</div>

<!-- Start overlay: the required entry point out of the ready state. -->
<div id="startOverlay" class="overlay show">
  <div class="dialog">
    <h2 data-i18n="title"></h2>
    <p data-i18n-html="aimhtml"></p>
    <label class="field">
      <span data-i18n="difficulty"></span>
      <select id="difficulty">
        <option value="easy" data-i18n="diff_easy"></option>
        <option value="normal" selected data-i18n="diff_normal"></option>
        <option value="hard" data-i18n="diff_hard"></option>
      </select>
    </label>
    <button id="btnStart" class="primary" data-i18n="start"></button>
  </div>
</div>

<!-- Result overlay: shown on win or on running out of moves. -->
<div id="overlay" class="overlay">
  <div class="dialog">
    <h2 id="dlgTitle"></h2>
    <p id="dlgSub"></p>
    <button id="dlgBtn" class="primary" data-i18n="replay"></button>
  </div>
</div>

<script src="../assets/i18n.js"></script>
<script>
/* ============================================================================
 * Match 3 — a single-file, zero-dependency, DOM-rendered match-3 game.
 *
 * Rendering: a CSS grid of 64 <div class="cell"> tiles is built once; every
 * frame transition only rewrites class names (colour + transient animation), so
 * there is no per-frame allocation and no canvas geometry to read back.
 *
 * Timing: the whole game flow is a requestAnimationFrame-driven state machine
 * (`phase`) that accumulates a per-frame delta. setTimeout is NEVER used to
 * advance the game, because the smoke harness stubs it out as a no-op. Each
 * phase has a duration in ms; when the accumulated time reaches it, the phase
 * handler runs and moves the machine on. Phases:
 *     idle -> swapping -> clearing -> falling -> refilling -> (clearing ...) -> idle
 *                       \-> reverting -> idle            (illegal swap, animate back)
 *     shuffling                                        (dead board, auto-reshuffle)
 *
 * Everything is written at the top level in ES5 so the bridge object `window.M3`
 * and the pure helpers below stay reachable from the test harness.
 * ========================================================================== */

var T = LiteI18N.create({
  title:       { en: 'Match 3', zh: '消消乐' },
  tip:         { en: 'Swap neighbouring gems to line up three or more of a colour.',
                 zh: '交换相邻宝石，连成三个或以上同色即可消除。' },
  score:       { en: 'Score', zh: '得分' },
  moves:       { en: 'Moves', zh: '步数' },
  target:      { en: 'Target', zh: '目标' },
  best:        { en: 'Best', zh: '最佳' },
  combo:       { en: 'Combo', zh: '连击' },
  level:       { en: 'Level', zh: '难度' },
  difficulty:  { en: 'Difficulty', zh: '难度' },
  diff_easy:   { en: 'Easy', zh: '简单' },
  diff_normal: { en: 'Normal', zh: '普通' },
  diff_hard:   { en: 'Hard', zh: '困难' },
  hint:        { en: 'Hint', zh: '提示' },
  shuffle:     { en: 'Shuffle', zh: '重排' },
  newgame:     { en: 'New Game', zh: '新游戏' },
  start:       { en: 'Start Game', zh: '开始游戏' },
  replay:      { en: 'Play Again', zh: '再来一局' },
  win:         { en: 'You Win!', zh: '你赢了！' },
  lose:        { en: 'Out of Moves', zh: '步数用尽' },
  resultSub:   { en: 'Score {score} · Target {target} · Best {best}',
                 zh: '得分 {score} · 目标 {target} · 最佳 {best}' },
  readyHint:   { en: 'Choose a difficulty, then press Start.',
                 zh: '选择难度，然后点击「开始游戏」。' },
  play:        { en: 'Swap two neighbours to line up 3+ of a colour.',
                 zh: '交换相邻两颗宝石，连成 3 个及以上同色。' },
  noMatch:     { en: 'No match there — pick another swap.',
                 zh: '这里消不掉，换个位置试试。' },
  shuffling:   { en: 'No moves left — reshuffling the board…',
                 zh: '没有可消除的走法，正在重排棋盘…' },
  reshuffled:  { en: 'Board reshuffled!',
                 zh: '棋盘已重排！' },
  aimhtml: {
    en: 'Click a gem, then click a neighbour to swap — or drag one onto another. ' +
        'Line up <b>3+</b> of a colour to clear them and jump your score.',
    zh: '点击一颗宝石，再点相邻的一颗即可交换 —— 也可以把它拖到邻格。' +
        '连成 <b>3 个及以上</b>同色宝石即可消除并得分。'
  }
});

/* -------------------------------------------------------------- constants */
var ROWS = 8;                       // board height in cells
var COLS = 8;                       // board width in cells
var BASE = 10;                      // base score per cleared gem

/* Gem colours. Index 0..6; a difficulty uses the first N of them. */
var PALETTE = ['#f43f5e', '#f59e0b', '#22c55e', '#3b82f6', '#a855f7', '#06b6d4', '#ec4899'];

/* Difficulty table: colour count, move limit and score target. */
var DIFF = {
  easy:   { colors: 5, moves: 30, target: 1000 },
  normal: { colors: 6, moves: 25, target: 1500 },
  hard:   { colors: 7, moves: 20, target: 2000 }
};

/* Phase durations (ms). The CSS animations are tuned to match, and the state
 * machine still owns all timing: an animation that never plays (a test stub, a
 * reduced-motion user, a background tab) changes nothing about the flow. */
var SWAP_MS     = 190;              // tiles slide across, then the machine parks
var REVERT_MS   = 190;              // illegal swap: shake, then restore
var CLEAR_MS    = 320;              // pop -> white flash -> shrink + spin out
var FALL_MS     = 300;              // gravity drop with a landing squash
var REFILL_MS   = 220;              // new gems drop in from above the board
var SHUFFLE_MS  = 320;

/* --------------------------------------------------------------- state */
var rows = ROWS;                    // live board dimensions
var cols = COLS;
var grid = [];                      // grid[r][c] = colour index, or null when empty
var status = 'ready';               // 'ready' | 'playing' | 'over'
var diffKey = 'normal';
var config = DIFF.normal;           // active difficulty config
var score = 0;
var moves = 0;
var target = 0;
var best = 0;
var combo = 0;                      // cascade round of the current move
var selected = null;                // [r, c] of the selected cell, or null

var phase = 'idle';                 // animation state machine (see header)
var phaseElapsed = 0;
var phaseDuration = 0;
var pendingClear = null;            // cells playing the 'clear' animation
var swapCells = null;               // two cells playing the 'swap' animation
var revertCells = null;             // two cells playing the 'bad' (revert) animation
var hintCells = null;               // two cells highlighted by the Hint button
var hintTimer = 0;                  // ms left on the hint highlight
var noticeKey = null;               // i18n key for the status line
var noticeVars = null;              // interpolation values for the status line
var endWin = false;                 // result of the finished game
var cascadeDepth = 0;               // safety cap on refill->clear loops
var dragFrom = null;                // [r, c] where a drag started
var suppressClick = false;          // swallow the click that follows a drag
var rng = Math.random;              // swappable for a seeded generator
var lastFrameTs = 0;                // previous rAF timestamp (browser only)
var cellEls = [];                   // cellEls[r][c] -> the tile element

/* ---------------------------------------------------------- fx state
 * `fxAt[r][c]` is a transient per-tile animation descriptor ({cls, vars}) that
 * `render()` folds into the tile's className. It exists because render() rebuilds
 * the WHOLE className every pass: a class poked on after render() would be wiped
 * by the next pass, and if the className string happened to repeat, the browser
 * would not replay the animation either. Routing every effect through this table
 * means the class is set once on phase entry (and cleared on phase exit), so the
 * animation always starts cleanly and simply runs out with the phase. */
var fxAt = [];                       // fxAt[r][c] = { cls: 'swap', vars: {...} } | null
var fxNodes = [];                   // decorations living on #fxLayer: [{el, ttl}]
var FX_MAX_NODES = 90;              // hard ceiling on live decoration nodes
var FX_MAX_BURSTS = 14;             // at most this many particle bursts per clear
var fxLayerEl = null;               // the overlay the decorations are attached to
var boardShakeTtl = 0;              // ms left on the board shake class

/* ------------------------------------------------------------ dom refs */
var boardEl = document.getElementById('board');
fxLayerEl = document.getElementById('fxLayer');   // decoration overlay (outside #board)
var scoreEl = document.getElementById('score');
var movesEl = document.getElementById('moves');
var targetEl = document.getElementById('target');
var bestEl = document.getElementById('best');
var comboEl = document.getElementById('combo');
var levelLabelEl = document.getElementById('levelLabel');
var noticeEl = document.getElementById('notice');
var diffEl = document.getElementById('difficulty');
var btnNew = document.getElementById('btnNew');
var btnStart = document.getElementById('btnStart');
var btnHint = document.getElementById('btnHint');
var btnShuffle = document.getElementById('btnShuffle');
var dlgTitle = document.getElementById('dlgTitle');
var dlgSub = document.getElementById('dlgSub');
var dlgBtn = document.getElementById('dlgBtn');
var startOverlay = document.getElementById('startOverlay');
var overlay = document.getElementById('overlay');

/* ======================================================================
 * Pure helpers — all of these are exposed on window.M3 and are safe to call
 * with any rectangular grid: they never mutate their argument.
 * ==================================================================== */

/* Dimensions of an arbitrary grid, tolerating ragged rows. */
function gridDims(g) {
  var r;
  var h = (g && g.length) ? g.length : 0;
  var w = 0;
  for (r = 0; r < h; r++) { if (g[r] && g[r].length > w) w = g[r].length; }
  return [h, w];
}

/* Read a colour, or null for an empty / out-of-range cell. */
function cellVal(g, r, c) {
  if (!g || r < 0 || r >= g.length) return null;
  var row = g[r];
  if (!row || c < 0 || c >= row.length) return null;
  var v = row[c];
  return (v === null || v === undefined || v < 0) ? null : v;
}

/* Deep copy of a rectangular grid. */
function copyGrid(g) {
  var out = [];
  for (var r = 0; r < g.length; r++) out.push(g[r] ? g[r].slice() : []);
  return out;
}

/* All cells that belong to a horizontal or vertical run of >= 3 equal colours.
 * Returns an array of [r, c] pairs, de-duplicated. Pure. */
function findMatches(g) {
  var dims = gridDims(g);
  var h = dims[0], w = dims[1];
  var out = [];
  var seen = {};
  var r, c;

  function push(rr, cc) {
    var k = rr + ':' + cc;
    if (!seen[k]) { seen[k] = 1; out.push([rr, cc]); }
  }
  function filled(rr, cc) {
    var v = cellVal(g, rr, cc);
    return v !== null;
  }

  // horizontal runs
  for (r = 0; r < h; r++) {
    var start = 0;
    for (c = 1; c <= w; c++) {
      var cont = c < w && filled(r, c) && filled(r, c - 1) &&
                 cellVal(g, r, c) === cellVal(g, r, c - 1);
      if (!cont) {
        if (c - start >= 3 && filled(r, start)) {
          for (var k = start; k < c; k++) push(r, k);
        }
        start = c;
      }
    }
  }
  // vertical runs
  for (c = 0; c < w; c++) {
    var top = 0;
    for (r = 1; r <= h; r++) {
      var cont2 = r < h && filled(r, c) && filled(r - 1, c) &&
                  cellVal(g, r, c) === cellVal(g, r - 1, c);
      if (!cont2) {
        if (r - top >= 3 && filled(top, c)) {
          for (var k2 = top; k2 < r; k2++) push(k2, c);
        }
        top = r;
      }
    }
  }
  return out;
}

/* Whether a grid contains any match at all. Pure, early-exit. */
function hasAnyMatch(g) {
  return findMatches(g).length > 0;
}

/* True when swapping (r1,c1) with (r2,c2) would create a match. Pure. */
function swapMakesMatch(g, r1, c1, r2, c2) {
  var t = copyGrid(g);
  var tmp = t[r1][c1];
  t[r1][c1] = t[r2][c2];
  t[r2][c2] = tmp;
  return findMatches(t).length > 0;
}

/* Whether any single adjacent swap on the board produces a match. Pure. */
function hasMove(g) {
  var dims = gridDims(g);
  var h = dims[0], w = dims[1];
  for (var r = 0; r < h; r++) {
    for (var c = 0; c < w; c++) {
      if (c + 1 < w && swapMakesMatch(g, r, c, r, c + 1)) return true;
      if (r + 1 < h && swapMakesMatch(g, r, c, r + 1, c)) return true;
    }
  }
  return false;
}

/* The first swap that would score, as [r1, c1, r2, c2], or null. Pure. */
function findHintMove(g) {
  var dims = gridDims(g);
  var h = dims[0], w = dims[1];
  for (var r = 0; r < h; r++) {
    for (var c = 0; c < w; c++) {
      if (c + 1 < w && swapMakesMatch(g, r, c, r, c + 1)) return [r, c, r, c + 1];
      if (r + 1 < h && swapMakesMatch(g, r, c, r + 1, c)) return [r, c, r + 1, c];
    }
  }
  return null;
}

/* Gravity: every gem falls to the lowest free cell of its column, empties end
 * up on top. Returns a new grid. Pure. */
function applyGravity(g) {
  var dims = gridDims(g);
  var h = dims[0], w = dims[1];
  var out = [];
  var r, c;
  for (r = 0; r < h; r++) {
    var row = [];
    for (c = 0; c < w; c++) row.push(null);
    out.push(row);
  }
  for (c = 0; c < w; c++) {
    var write = h - 1;
    for (r = h - 1; r >= 0; r--) {
      var v = cellVal(g, r, c);
      if (v !== null) { out[write][c] = v; write--; }
    }
  }
  return out;
}

/* Fill every empty cell with a random colour in [0, colorCount). Existing
 * values are preserved. Returns a new grid. Pure. */
function refill(g, colorCount) {
  var cc = (typeof colorCount === 'number' && colorCount > 0) ? Math.floor(colorCount) : 1;
  var dims = gridDims(g);
  var h = dims[0], w = dims[1];
  var out = [];
  for (var r = 0; r < h; r++) {
    var row = [];
    for (var c = 0; c < w; c++) {
      var v = cellVal(g, r, c);
      row.push(v === null ? randInt(cc) : v);
    }
    out.push(row);
  }
  return out;
}

/* ------------------------------------------------------------- rng utils */
/* Integer in [0, n) drawn from the active generator. */
function randInt(n) {
  return Math.floor(rng() * n);
}

/* A seeded mulberry32 generator; accepts a number or a string seed. */
function makeRng(seed) {
  var s = seed;
  if (typeof s === 'string') {
    var h = 2166136261;
    for (var i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619) >>> 0;
    }
    s = h;
  }
  s = Number(s);
  if (isNaN(s) || s === Infinity || s === -Infinity) s = 1;
  s = s >>> 0;
  if (s === 0) s = 0x9e3779b9;
  return function () {
    s = (s + 0x6D2B79F5) >>> 0;
    var t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* Fisher–Yates shuffle of an array in place, using the active generator. */
function shuffleArr(a) {
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
}

/* ======================================================================
 * Board construction — always yields a board with NO pre-existing match and
 * at least one legal swap, so a fresh game can never be dead on arrival.
 * ==================================================================== */

/* Randomly fill a board that has no run of 3 (constraints on the two cells to
 * the left and the two above). No move guarantee — callers verify. */
function buildNoMatchBoard(colors) {
  var cc = (colors && colors > 0) ? colors : 3;
  var g = [];
  for (var r = 0; r < rows; r++) {
    var row = [];
    for (var c = 0; c < cols; c++) {
      var banned = {};
      var l1 = (c >= 1) ? row[c - 1] : null;
      var l2 = (c >= 2) ? row[c - 2] : null;
      if (l1 !== null && l1 === l2) banned[l1] = 1;
      var u1 = (r >= 1) ? g[r - 1][c] : null;
      var u2 = (r >= 2) ? g[r - 2][c] : null;
      if (u1 !== null && u1 === u2) banned[u1] = 1;
      var v, tries = 0;
      do { v = randInt(cc); tries++; } while (banned[v] && tries < 64);
      row.push(v);
    }
    g.push(row);
  }
  return g;
}

/* Deterministic last-resort board: plant an L that is one swap away from a
 * line, then verify the board has no immediate match but does have a move. */
function patchedBoard(colors) {
  if (rows < 3 || cols < 3) return buildNoMatchBoard(colors);
  for (var attempt = 0; attempt < 80; attempt++) {
    var g = buildNoMatchBoard(colors);
    for (var x = 0; x < colors; x++) {
      for (var y = 0; y < colors; y++) {
        if (y === x) continue;
        var t = copyGrid(g);
        // (0,0)=X (0,1)=X (0,2)=Y  and  (1,2)=X :
        // swapping (0,2) with (1,2) turns row 0 into X X X. No initial line.
        t[0][0] = x; t[0][1] = x; t[0][2] = y; t[1][2] = x;
        if (!hasAnyMatch(t) && hasMove(t)) return t;
      }
    }
  }
  return buildNoMatchBoard(colors);
}

/* A guaranteed-playable starting board. */
function buildPlayableBoard(colors) {
  for (var i = 0; i < 400; i++) {
    var g = buildNoMatchBoard(colors);
    if (hasMove(g)) return g;
  }
  return patchedBoard(colors);
}

/* Reshuffle the live board, preserving the multiset of colours, until it has
 * no initial match and at least one swap. Falls back to a fresh board. */
function shuffleBoard(colors) {
  var flat = [];
  for (var r = 0; r < rows; r++) {
    for (var c = 0; c < cols; c++) {
      var v = cellVal(grid, r, c);
      if (v !== null) flat.push(v);
    }
  }
  if (flat.length !== rows * cols) return buildPlayableBoard(colors);

  for (var i = 0; i < 400; i++) {
    shuffleArr(flat);
    var g = [];
    var idx = 0;
    for (var r2 = 0; r2 < rows; r2++) {
      var row = [];
      for (var c2 = 0; c2 < cols; c2++) { row.push(flat[idx]); idx++; }
      g.push(row);
    }
    if (!hasAnyMatch(g) && hasMove(g)) return g;
  }
  return buildPlayableBoard(colors);
}

/* ======================================================================
 * Rendering
 * ==================================================================== */

/* Build the 64 tile elements once and cache them by coordinate. */
function buildDom() {
  boardEl.innerHTML = '';
  cellEls = [];
  for (var r = 0; r < rows; r++) {
    var row = [];
    for (var c = 0; c < cols; c++) {
      var el = document.createElement('div');
      el.className = 'cell empty';
      boardEl.appendChild(el);
      row.push(el);
    }
    cellEls.push(row);
  }
}

function inList(list, r, c) {
  if (!list) return false;
  for (var i = 0; i < list.length; i++) {
    if (list[i][0] === r && list[i][1] === c) return true;
  }
  return false;
}

/* -------------------------------------------------------------- fx helpers */

/* Safe CSS custom-property write: the smoke stub's setProperty is a no-op and
 * older jsdom builds can throw on an unknown property, so never let it bubble. */
function setVar(el, key, value) {
  if (!el || !el.style || typeof el.style.setProperty !== 'function') return;
  try { el.style.setProperty(key, String(value)); } catch (e) {}
}

/* Detach a decoration node, tolerating whichever parent link the DOM stub sets. */
function detachNode(el) {
  if (!el) return;
  var p = el.parentNode || el.parent;
  if (p && typeof p.removeChild === 'function') {
    try { p.removeChild(el); } catch (e) {}
  }
}

/* Record a transient animation for one tile. render() folds `cls` into the tile
 * className and writes `vars` as CSS custom properties. Routing effects through
 * this table (instead of poking classes on after render) is what keeps them from
 * being wiped by the next full-className repaint. */
function setFx(r, c, cls, vars) {
  if (r < 0 || r >= rows || c < 0 || c >= cols) return;
  if (!fxAt[r]) fxAt[r] = [];
  fxAt[r][c] = { cls: cls, vars: vars || null };
}

/* Drop every per-tile effect — called on each phase transition, so an effect
 * lives exactly as long as its phase. */
function clearFx() {
  fxAt = [];
}

/* Attach a decoration and start its life clock. Retirement is driven by the rAF
 * `update(dt)` clock (never by animation events, which no harness delivers) and
 * the list is hard-capped so a pathological cascade cannot grow the DOM. */
function addFxNode(el, ttl) {
  if (!fxLayerEl || !el) return;
  fxLayerEl.appendChild(el);
  fxNodes.push({ el: el, ttl: ttl });
  while (fxNodes.length > FX_MAX_NODES) detachNode(fxNodes.shift().el);
}

/* Retire every live decoration (used when the board is rebuilt). */
function clearFxNodes() {
  for (var i = 0; i < fxNodes.length; i++) detachNode(fxNodes[i].el);
  fxNodes = [];
}

/* Age the decorations; anything past its ttl is removed. */
function ageFxNodes(dt) {
  if (!fxNodes.length) return;
  var keep = [];
  for (var i = 0; i < fxNodes.length; i++) {
    var n = fxNodes[i];
    n.ttl -= dt;
    if (n.ttl <= 0) detachNode(n.el);
    else keep.push(n);
  }
  fxNodes = keep;
}

/* An empty anchor already positioned over tile (r, c) on the decoration grid,
 * so a burst lines up with its tile without reading geometry back. */
function fxAnchor(r, c) {
  var a = document.createElement('div');
  a.className = 'fx-anchor';
  setVar(a, 'grid-row', String(r + 1));
  setVar(a, 'grid-column', String(c + 1));
  return a;
}

/* Impact decoration for one cleared gem: an expanding ring plus a fan of sparks
 * tinted with the gem's own colour. */
function spawnBurst(r, c, colorIndex) {
  if (!fxLayerEl) return;
  if (fxNodes.length > FX_MAX_NODES - 8) return;               // budget guard
  var anchor = fxAnchor(r, c);

  var ring = document.createElement('div');
  ring.className = 'fx-ring';
  anchor.appendChild(ring);

  var col = PALETTE[colorIndex] || '#ffffff';
  var n = 6;
  for (var i = 0; i < n; i++) {
    var ang = (Math.PI * 2 * i) / n + (r * 0.7 + c * 0.4);
    var sp = document.createElement('div');
    sp.className = 'fx-spark';
    setVar(sp, '--sx', Math.cos(ang).toFixed(3));
    setVar(sp, '--sy', Math.sin(ang).toFixed(3));
    setVar(sp, '--spread', (26 + ((i * 7 + r * 5 + c * 3) % 16)) + 'px');
    setVar(sp, '--spark', col);
    anchor.appendChild(sp);
  }
  addFxNode(anchor, CLEAR_MS + 260);
}

/* "+30" drifting up from a cleared cluster. Pure digits — no new copy. */
function spawnScoreFloat(r, c, text) {
  if (!fxLayerEl) return;
  var anchor = fxAnchor(r, c);
  var f = document.createElement('div');
  f.className = 'fx-float';
  f.textContent = text;
  anchor.appendChild(f);
  addFxNode(anchor, 900);
}

/* The big "x2" / "x3" pop in the middle of the board. */
function spawnComboFloat(mult) {
  if (!fxLayerEl) return;
  var a = document.createElement('div');
  a.className = 'fx-anchor fx-full';
  var t = document.createElement('div');
  t.className = 'fx-combo';
  t.textContent = '\u00d7' + mult;                             // -> x2
  a.appendChild(t);
  addFxNode(a, 1000);
}

/* A very short board wobble when a chain lands. */
function shakeBoard() {
  if (!boardEl || !boardEl.classList) return;
  boardEl.classList.add('shake');
  boardShakeTtl = 260;
}

/* Translate a cleared grid into per-tile fall offsets. `before` is the grid with
 * the matched cells already set to null; because gravity preserves column order
 * and stacks the surviving gems on the bottom, a gem's landing row is implied by
 * its index in the column's compacted list. A gem that fell `d` rows therefore
 * starts `d` rows higher and slides home. */
function applyFallFx(before) {
  for (var c = 0; c < cols; c++) {
    var src = [];
    for (var r = 0; r < rows; r++) {
      if (cellVal(before, r, c) !== null) src.push(r);
    }
    var m = src.length;
    for (var i = 0; i < m; i++) {
      var dst = rows - m + i;
      var fell = dst - src[i];
      if (fell > 0) setFx(dst, c, 'fall', { '--fx-ny': -fell, '--fx-ms': FALL_MS + 'ms' });
    }
  }
}

/* New gems in a column are the consecutive rows at the top, so they all travel
 * the same distance and enter as one block from above the board. */
function applyRefillFx(before) {
  for (var c = 0; c < cols; c++) {
    var m = 0;
    for (var r = 0; r < rows; r++) if (cellVal(before, r, c) === null) m++;
    if (!m) continue;
    for (var i = 0; i < m; i++) {
      setFx(i, c, 'drop', { '--fx-ny': -m, '--fx-ms': REFILL_MS + 'ms' });
    }
  }
}

/* Repaint every tile from the current grid + transient phase state. */
function render() {
  for (var r = 0; r < rows; r++) {
    for (var c = 0; c < cols; c++) {
      var el = cellEls[r][c];
      if (!el) continue;
      var v = cellVal(grid, r, c);
      var cls = 'cell';
      cls += (v === null) ? ' empty' : (' c' + v);
      if (selected && selected[0] === r && selected[1] === c) cls += ' sel';
      if (phase === 'reverting' && inList(revertCells, r, c)) cls += ' bad';
      if (hintTimer > 0 && inList(hintCells, r, c)) cls += ' hint';
      var fx = (fxAt[r] && fxAt[r][c]) ? fxAt[r][c] : null;
      if (fx) cls += ' ' + fx.cls;
      el.className = cls;
      if (fx && fx.vars) {
        for (var k in fx.vars) {
          if (fx.vars.hasOwnProperty(k)) setVar(el, k, fx.vars[k]);
        }
      }
    }
  }
}

/* ======================================================================
 * HUD — every string that depends on the language is written here, so a single
 * change subscriber is enough to re-localise the whole screen.
 * ==================================================================== */
function updateHud() {
  if (scoreEl) scoreEl.textContent = String(score);
  if (movesEl) movesEl.textContent = String(Math.max(0, moves));
  if (targetEl) targetEl.textContent = String(target);
  if (bestEl) bestEl.textContent = String(best);
  if (levelLabelEl) levelLabelEl.textContent = T.t('diff_' + diffKey);
  if (comboEl) comboEl.textContent = (combo > 1) ? ('x' + combo) : '-';
  if (noticeEl) noticeEl.textContent = noticeKey ? T.t(noticeKey, noticeVars) : '';

  if (status === 'over') {
    if (dlgTitle) dlgTitle.textContent = T.t(endWin ? 'win' : 'lose');
    if (dlgSub) dlgSub.textContent = T.t('resultSub', { score: score, target: target, best: best });
  }

  if (btnNew) btnNew.disabled = (status === 'ready');
  if (btnHint) btnHint.disabled = (status !== 'playing' || phase !== 'idle');
  if (btnShuffle) btnShuffle.disabled = (status !== 'playing' || phase !== 'idle');
  if (diffEl) diffEl.disabled = (status === 'playing');
  if (btnStart) btnStart.disabled = (status === 'playing');
}

/* ======================================================================
 * Persistence — localStorage only (no removeItem anywhere).
 * ==================================================================== */
function loadBest() {
  try {
    var v = parseInt(localStorage.getItem('match3_best') || '0', 10);
    best = isNaN(v) ? 0 : v;
  } catch (e) { best = 0; }
}
function saveBest() {
  try { localStorage.setItem('match3_best', String(best)); } catch (e) {}
}

/* ======================================================================
 * Game lifecycle
 * ==================================================================== */

/* Build a fresh board for the current difficulty. Ends in the 'ready' state. */
function setupBoard(seed) {
  config = DIFF[diffKey] || DIFF.normal;
  rows = ROWS;
  cols = COLS;
  rng = (seed === null || seed === undefined) ? Math.random : makeRng(seed);

  grid = buildPlayableBoard(config.colors);
  score = 0;
  moves = config.moves;
  target = config.target;
  combo = 0;
  selected = null;
  phase = 'idle';
  phaseElapsed = 0;
  phaseDuration = 0;
  pendingClear = null;
  swapCells = null;
  revertCells = null;
  hintCells = null;
  hintTimer = 0;
  cascadeDepth = 0;
  dragFrom = null;
  suppressClick = false;
  clearFx();
  clearFxNodes();
  boardShakeTtl = 0;
  if (boardEl && boardEl.classList) boardEl.classList.remove('shake');
  loadBest();
  status = 'ready';
  noticeKey = 'readyHint';
  noticeVars = null;

  if (startOverlay) startOverlay.classList.add('show');
  if (overlay) overlay.classList.remove('show');
  updateHud();
  render();
}

/* Leave the ready state and begin play. */
function startGame() {
  if (status === 'playing') return;
  if (status === 'over') { restart(); return; }
  status = 'playing';
  noticeKey = 'play';
  noticeVars = null;
  if (startOverlay) startOverlay.classList.remove('show');
  if (overlay) overlay.classList.remove('show');
  updateHud();
  render();
}

/* Start a brand new game (used by the buttons and by the bridge). Also the
 * deterministic entry point for tests: newGame({ difficulty, seed }). */
function newGame(opts) {
  opts = opts || {};
  if (opts.difficulty && DIFF[opts.difficulty]) diffKey = opts.difficulty;
  setupBoard(opts.seed);
  status = 'playing';
  noticeKey = 'play';
  noticeVars = null;
  if (startOverlay) startOverlay.classList.remove('show');
  if (overlay) overlay.classList.remove('show');
  updateHud();
  render();
  return getSnapshot();
}

/* Restart at the current difficulty, skipping the start overlay. */
function restart() {
  newGame({ difficulty: diffKey });
}

/* Finish the game. */
function endGame(win) {
  status = 'over';
  endWin = !!win;
  phase = 'idle';
  phaseElapsed = 0;
  clearFx();
  boardShakeTtl = 0;
  if (boardEl && boardEl.classList) boardEl.classList.remove('shake');
  if (score > best) { best = score; saveBest(); }
  if (overlay) overlay.classList.add('show');
  updateHud();
}

/* ======================================================================
 * Interaction
 * ==================================================================== */
function isAdjacent(r1, c1, r2, c2) {
  return (Math.abs(r1 - r2) + Math.abs(c1 - c2)) === 1;
}

/* Map a tile element back to its [r, c] by identity scan (robust under the
 * stub DOM, which does not deliver us coordinates). */
function posOfCell(el) {
  for (var r = 0; r < cellEls.length; r++) {
    for (var c = 0; c < cellEls[r].length; c++) {
      if (cellEls[r][c] === el) return [r, c];
    }
  }
  return null;
}

/* Resolve a pointer event to a board cell using the container's client rect.
 * Returns null when the coordinates are unavailable (e.g. stubbed events). */
function posFromEvent(ev) {
  if (!ev || typeof ev.clientX !== 'number' || typeof ev.clientY !== 'number') return null;
  if (!boardEl || typeof boardEl.getBoundingClientRect !== 'function') return null;
  var rect = boardEl.getBoundingClientRect();
  if (!rect || !rect.width || !rect.height) return null;
  var cw = rect.width / cols;
  var ch = rect.height / rows;
  var c = Math.floor((ev.clientX - rect.left) / cw);
  var r = Math.floor((ev.clientY - rect.top) / ch);
  if (r < 0 || r >= rows || c < 0 || c >= cols) return null;
  return [r, c];
}

/* Click-select flow: first click selects, a second click on a neighbour swaps. */
function cellSelect(r, c) {
  if (status !== 'playing' || phase !== 'idle') return;
  if (!selected) {
    selected = [r, c];
    render();
    return;
  }
  var sr = selected[0], sc = selected[1];
  if (sr === r && sc === c) {
    selected = null;
    render();
    return;
  }
  if (isAdjacent(sr, sc, r, c)) {
    selected = null;
    attemptSwap(sr, sc, r, c);
  } else {
    selected = [r, c];
    render();
  }
}

/* Try to swap two adjacent cells. A legal swap (one that makes a match) costs a
 * move and kicks off the resolve pipeline; an illegal swap animates back and
 * costs nothing. Returns whether the swap was legal. */
function attemptSwap(r1, c1, r2, c2) {
  if (status !== 'playing' || phase !== 'idle') return false;

  var a = grid[r1][c1];
  grid[r1][c1] = grid[r2][c2];
  grid[r2][c2] = a;

  if (hasAnyMatch(grid)) {
    moves--;
    combo = 0;
    cascadeDepth = 0;
    swapCells = [[r1, c1], [r2, c2]];
    noticeKey = 'play';
    noticeVars = null;
    /* The data layer has already swapped the two colours, so each tile must
     * START on its partner's square and slide home — that reads as the two gems
     * crossing over rather than blinking to a new colour. */
    clearFx();
    setFx(r1, c1, 'swap', { '--fx-nx': c2 - c1, '--fx-ny': r2 - r1, '--fx-ms': SWAP_MS + 'ms' });
    setFx(r2, c2, 'swap', { '--fx-nx': c1 - c2, '--fx-ny': r1 - r2, '--fx-ms': SWAP_MS + 'ms' });
    phase = 'swapping';
    phaseElapsed = 0;
    phaseDuration = SWAP_MS;
    updateHud();
    render();
    return true;
  }

  var b = grid[r1][c1];
  grid[r1][c1] = grid[r2][c2];
  grid[r2][c2] = b;

  revertCells = [[r1, c1], [r2, c2]];
  noticeKey = 'noMatch';
  noticeVars = null;
  phase = 'reverting';
  phaseElapsed = 0;
  phaseDuration = REVERT_MS;
  updateHud();
  render();
  return false;
}

/* ------------------------------------------------------------- phases */

/* Begin one cascade round: score the matches, animate them out. */
function beginClear() {
  pendingClear = findMatches(grid);
  if (!pendingClear.length) { finishMove(); return; }

  cascadeDepth++;
  if (cascadeDepth > 40) { finishMove(); return; }   // safety net

  combo++;
  var gained = pendingClear.length * BASE * combo;
  score += gained;
  if (score > best) { best = score; saveBest(); }

  /* One effect class for every cleared tile, then the decorations: a burst on
   * the first few tiles (bounded so a 60-gem clear cannot spawn hundreds of
   * nodes), the "+N" award floating up from the cluster's centre, and — from the
   * second cascade round on — a big multiplier pop plus a board wobble. */
  clearFx();
  var i, pr, pc, cx = 0, cy = 0, bursts = 0;
  for (i = 0; i < pendingClear.length; i++) {
    pr = pendingClear[i][0]; pc = pendingClear[i][1];
    setFx(pr, pc, 'clear', null);
    cx += pc; cy += pr;
    if (bursts < FX_MAX_BURSTS) { spawnBurst(pr, pc, cellVal(grid, pr, pc)); bursts++; }
  }
  cx = Math.round(cx / pendingClear.length);
  cy = Math.round(cy / pendingClear.length);
  spawnScoreFloat(cy, cx, '+' + gained);
  if (combo >= 2) { spawnComboFloat(combo); shakeBoard(); }

  phase = 'clearing';
  phaseElapsed = 0;
  phaseDuration = CLEAR_MS;
  updateHud();
  render();
}

function onSwapDone() {
  swapCells = null;
  clearFx();
  beginClear();
}

function onRevertDone() {
  revertCells = null;
  clearFx();
  phase = 'idle';
  updateHud();
  render();
}

function onClearDone() {
  var i;
  for (i = 0; i < pendingClear.length; i++) {
    grid[pendingClear[i][0]][pendingClear[i][1]] = null;
  }
  pendingClear = null;
  /* Gravity is a pure transform of the grid, so the fall distance is already
   * implied by the cleared grid: within a column the non-empty gems keep their
   * order and stack on the bottom. applyFallFx() derives exactly that from
   * `before`, so no second grid has to be handed around. Do not skip the call:
   * the timing machine is unchanged either way, but the tiles need the offsets
   * to animate. */
  var settled = applyGravity(grid);
  clearFx();
  applyFallFx(grid);
  grid = settled;
  phase = 'falling';
  phaseElapsed = 0;
  phaseDuration = FALL_MS;
  render();
}

function onFallDone() {
  var before = grid;                  // settled grid, empties along the top
  grid = refill(grid, config.colors);
  clearFx();
  applyRefillFx(before);
  phase = 'refilling';
  phaseElapsed = 0;
  phaseDuration = REFILL_MS;
  render();
}

function onRefillDone() {
  if (hasAnyMatch(grid)) {
    beginClear();                 // chain reaction -> new cascade round
  } else {
    finishMove();
  }
}

function onShuffleDone() {
  grid = shuffleBoard(config.colors);
  clearFx();
  phase = 'idle';
  phaseElapsed = 0;
  noticeKey = 'reshuffled';
  noticeVars = null;
  if (!hasMove(grid)) grid = buildPlayableBoard(config.colors);
  updateHud();
  render();
}

/* End of a move: settle into idle, then decide win / lose / auto-shuffle. */
function finishMove() {
  phase = 'idle';
  phaseElapsed = 0;
  /* This is the convergence point of every resolve path, so the last phase's
   * per-tile effects are retired here — otherwise the refill `drop` descriptor
   * would outlive its phase and sit on the tiles until the next legal swap. */
  clearFx();
  if (score > best) { best = score; saveBest(); }

  if (score >= target) { endGame(true); return; }
  if (moves <= 0) { endGame(false); return; }
  if (!hasMove(grid)) { startShuffle(); return; }
  updateHud();
  render();
}

/* Enter the auto-shuffle phase (also reused by the Shuffle button). */
function startShuffle() {
  if (phase === 'shuffling') return;
  phase = 'shuffling';
  phaseElapsed = 0;
  phaseDuration = SHUFFLE_MS;
  noticeKey = 'shuffling';
  noticeVars = null;
  updateHud();
  render();
}

/* -------------------------------------------------------------- buttons */
function doHint() {
  if (status !== 'playing' || phase !== 'idle') return;
  var mv = findHintMove(grid);
  if (!mv) { startShuffle(); return; }
  hintCells = [[mv[0], mv[1]], [mv[2], mv[3]]];
  hintTimer = 1200;
  render();
}

function doShuffle() {
  if (status !== 'playing' || phase !== 'idle') return;
  startShuffle();
}

/* ======================================================================
 * Frame loop — a single rAF chain driving the phase timers. No setTimeout.
 * ==================================================================== */
function update(dt) {
  /* Decoration lifetimes and the board wobble run on their own clocks, so they
   * keep expiring even while the phase machine sits idle. */
  ageFxNodes(dt);
  if (boardShakeTtl > 0) {
    boardShakeTtl -= dt;
    if (boardShakeTtl <= 0) {
      boardShakeTtl = 0;
      if (boardEl && boardEl.classList) boardEl.classList.remove('shake');
    }
  }

  if (hintTimer > 0) {
    hintTimer -= dt;
    if (hintTimer <= 0) { hintTimer = 0; hintCells = null; render(); }
  }

  if (phase === 'idle') return;

  phaseElapsed += dt;
  if (phaseElapsed < phaseDuration) return;
  phaseElapsed = 0;

  if (phase === 'swapping') onSwapDone();
  else if (phase === 'reverting') onRevertDone();
  else if (phase === 'clearing') onClearDone();
  else if (phase === 'falling') onFallDone();
  else if (phase === 'refilling') onRefillDone();
  else if (phase === 'shuffling') onShuffleDone();
}

function loop(ts) {
  var dt = 16;                        // nominal frame when no timestamp is given
  if (typeof ts === 'number') {
    if (lastFrameTs) {
      dt = ts - lastFrameTs;
      if (dt <= 0 || dt > 200) dt = 16;
    }
    lastFrameTs = ts;
  }
  update(dt);
  requestAnimationFrame(loop);
}

/* ======================================================================
 * Bridge object for tests / QA (assigned at the end of the script).
 * Pure helpers never mutate their arguments.
 * ==================================================================== */
function getSnapshot() {
  return {
    status: status,
    grid: copyGrid(grid),
    score: score,
    moves: moves,
    target: target,
    combo: combo,
    selected: selected ? [selected[0], selected[1]] : null,
    lang: T.lang
  };
}

/* ======================================================================
 * Event wiring
 * ==================================================================== */
function bindClick(id, fn) {
  var el = document.getElementById(id);
  if (el) el.addEventListener('click', fn);
}

bindClick('btnStart', function () { startGame(); });
bindClick('btnNew', function () { restart(); });
bindClick('dlgBtn', function () { restart(); });
bindClick('btnHint', function () { doHint(); });
bindClick('btnShuffle', function () { doShuffle(); });

// Board interactions use delegation on the container so the handler also works
// when the harness dispatches clicks straight at the tiles.
boardEl.addEventListener('click', function (ev) {
  if (suppressClick) { suppressClick = false; return; }
  var t = ev && ev.target;
  var cellEl = (t && typeof t.closest === 'function') ? t.closest('.cell') : t;
  if (!cellEl) return;
  var pos = posOfCell(cellEl);
  if (pos) cellSelect(pos[0], pos[1]);
});

// Drag support: press on a gem, release on a neighbouring one.
boardEl.addEventListener('pointerdown', function (ev) {
  if (status !== 'playing' || phase !== 'idle') return;
  var pos = posFromEvent(ev);
  if (!pos) {
    var t = ev && ev.target;
    var cellEl = (t && typeof t.closest === 'function') ? t.closest('.cell') : t;
    pos = cellEl ? posOfCell(cellEl) : null;
  }
  dragFrom = pos;
});

boardEl.addEventListener('pointerup', function (ev) {
  if (!dragFrom) return;
  var from = dragFrom;
  dragFrom = null;
  var pos = posFromEvent(ev);
  if (pos && (pos[0] !== from[0] || pos[1] !== from[1]) &&
      isAdjacent(from[0], from[1], pos[0], pos[1])) {
    suppressClick = true;
    selected = null;
    attemptSwap(from[0], from[1], pos[0], pos[1]);
  }
});

boardEl.addEventListener('pointercancel', function () { dragFrom = null; });

if (diffEl) {
  diffEl.addEventListener('change', function () {
    diffKey = diffEl.value || 'normal';
    if (status !== 'playing') setupBoard();   // re-roll only while not mid-game
  });
}

// Backdrop tap dismisses the result dialog (a fresh game is one tap away).
if (overlay) {
  overlay.addEventListener('click', function (ev) {
    if (ev.target === overlay) overlay.classList.remove('show');
  });
}

window.addEventListener('keydown', function (ev) {
  var k = ev.key;
  if (status === 'ready' || status === 'over') {
    if (k === ' ' || k === 'Enter') {
      if (ev.preventDefault) ev.preventDefault();
      startGame();
    }
    return;
  }
  if (k === 'h' || k === 'H') { doHint(); }
  else if (k === 'r' || k === 'R') { doShuffle(); }
});

// Re-localise the whole screen on a language change — one callback only.
T.onChange(function () { updateHud(); render(); });

/* ======================================================================
 * Boot: initialise and render the first screen, then start i18n LAST.
 * ==================================================================== */
buildDom();
setupBoard();
window.M3 = {
  getState: getSnapshot,
  findMatches: findMatches,
  applyGravity: applyGravity,
  hasMove: hasMove,
  refill: refill,
  newGame: newGame,
  colors: PALETTE.slice(),
  rows: ROWS,
  cols: COLS
};
T.start();
requestAnimationFrame(loop);
</script>
</body>
</html>
