<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0f1220" />
<title>贪吃蛇 · Snake</title>
<style>
  /* ============================================================
     样式分区：基础 / 布局 / 顶栏 / 游戏区 / Overlay
     ============================================================ */
  :root {
    --bg: #0f1220;
    --panel: #1a1f35;
    --grid-line: rgba(255, 255, 255, 0.04);
    --snake-head: #7dffb2;
    --snake-body: #2fbf71;
    --food: #ff5d73;
    --text: #e8ecf5;
    --text-dim: #9aa3b8;
    --accent: #4cc9f0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "PingFang SC", "Microsoft YaHei", -apple-system, "Segoe UI", sans-serif;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none; /* 阻止触屏下拉刷新 */
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 16px;
    min-height: 100vh;
    min-height: 100dvh;
  }

  /* ---------- 顶栏：分数信息 ---------- */
  .topbar {
    width: var(--board-size, 480px);
    max-width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 16px;
    background: var(--panel);
    border-radius: 12px;
    font-size: 15px;
  }
  .topbar .label { color: var(--text-dim); margin-right: 6px; }
  .topbar .value { font-weight: 700; font-variant-numeric: tabular-nums; }
  .topbar .score { color: var(--snake-head); }
  .topbar .best  { color: var(--accent); }
  .topbar .hint  { color: var(--text-dim); font-size: 12px; }

  /* ---------- 游戏区 ---------- */
  .board-wrap {
    position: relative;
    width: var(--board-size, 480px);
    max-width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 14px;
    overflow: hidden;
    background: var(--panel);
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.45);
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none; /* 手势交给游戏自己处理 */
  }

  /* ---------- Overlay：开始 / 结束 / 暂停 ---------- */
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: rgba(10, 12, 24, 0.78);
    backdrop-filter: blur(4px);
    text-align: center;
    padding: 24px;
    transition: opacity 0.2s ease;
  }
  .hidden { display: none !important; }
  .overlay.hidden { opacity: 0; pointer-events: none; }

  .overlay h1 { font-size: 30px; letter-spacing: 2px; }
  .overlay .sub { color: var(--text-dim); font-size: 14px; line-height: 1.9; }
  .overlay .final-score {
    font-size: 44px;
    font-weight: 800;
    color: var(--snake-head);
    font-variant-numeric: tabular-nums;
  }
  .overlay .record-tip { color: var(--food); font-weight: 700; font-size: 15px; }

  .btn {
    margin-top: 6px;
    padding: 12px 34px;
    font-size: 16px;
    font-weight: 700;
    color: #06251a;
    background: linear-gradient(135deg, var(--snake-head), var(--snake-body));
    border: none;
    border-radius: 999px;
    cursor: pointer;
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(47, 191, 113, 0.35); }
  .btn:active { transform: translateY(0); }

  .key-hint { color: var(--text-dim); font-size: 12.5px; }
  .key-hint kbd {
    display: inline-block;
    padding: 1px 7px;
    margin: 0 2px;
    border: 1px solid #3a4160;
    border-bottom-width: 2px;
    border-radius: 5px;
    background: #232946;
    color: var(--text);
    font-family: inherit;
    font-size: 11.5px;
  }
</style>
</head>
<body>

  <!-- 顶栏：当前分数 / 最高分 -->
  <div class="topbar">
    <span><span class="label">分数</span><span class="value score" id="score">0</span></span>
    <span class="hint" id="hint">方向键 / WASD 移动 · 空格暂停</span>
    <span><span class="label">最高分</span><span class="value best" id="best">0</span></span>
  </div>

  <!-- 游戏区 -->
  <div class="board-wrap">
    <canvas id="game" width="480" height="480"></canvas>

    <!-- 开始界面 -->
    <div class="overlay" id="startOverlay">
      <h1>贪吃蛇</h1>
      <p class="sub">
        <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> 或 <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 控制方向<br>
        手机上直接滑动屏幕即可转向
      </p>
      <button class="btn" id="startBtn">开始游戏</button>
      <p class="key-hint">按 <kbd>Enter</kbd> 也可以开始</p>
    </div>

    <!-- 结束界面 -->
    <div class="overlay hidden" id="gameOverOverlay">
      <h1>游戏结束</h1>
      <div class="final-score" id="finalScore">0</div>
      <div class="record-tip hidden" id="recordTip">🎉 新纪录！</div>
      <p class="sub" id="finalBest">最高分：0</p>
      <button class="btn" id="restartBtn">再来一局</button>
      <p class="key-hint">按 <kbd>Enter</kbd> 重新开始</p>
    </div>

    <!-- 暂停界面 -->
    <div class="overlay hidden" id="pauseOverlay">
      <h1>已暂停</h1>
      <p class="key-hint">按 <kbd>空格</kbd> 继续</p>
    </div>
  </div>

<script>
(function () {
  'use strict';

  /* ============================================================
     一、常量与配置
     ============================================================ */
  var GRID = 24;                 // 棋盘 24 x 24 格
  var CELL = 20;                 // 每格像素（canvas 逻辑尺寸 480x480）
  var CANVAS_SIZE = GRID * CELL; // 480

  var BASE_SPEED = 150;          // 初始步进间隔（毫秒）
  var MIN_SPEED = 65;            // 速度上限（间隔下限，越小越快）
  var SPEED_STEP = 4;            // 每吃一个食物，间隔减少的毫秒数

  var SCORE_PER_FOOD = 10;       // 每个食物得分
  var BEST_KEY = 'snake_best_score'; // localStorage 键名

  var Direction = {
    UP:    { x: 0,  y: -1 },
    DOWN:  { x: 0,  y: 1  },
    LEFT:  { x: -1, y: 0  },
    RIGHT: { x: 1,  y: 0  }
  };

  /* ============================================================
     二、DOM 引用
     ============================================================ */
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var scoreEl = document.getElementById('score');
  var bestEl = document.getElementById('best');
  var startOverlay = document.getElementById('startOverlay');
  var gameOverOverlay = document.getElementById('gameOverOverlay');
  var pauseOverlay = document.getElementById('pauseOverlay');
  var finalScoreEl = document.getElementById('finalScore');
  var finalBestEl = document.getElementById('finalBest');
  var recordTipEl = document.getElementById('recordTip');
  var startBtn = document.getElementById('startBtn');
  var restartBtn = document.getElementById('restartBtn');

  /* ============================================================
     三、游戏状态
     ============================================================ */
  var GameState = {
    READY: 'ready',     // 开始界面
    RUNNING: 'running', // 游戏中
    PAUSED: 'paused',   // 暂停
    OVER: 'over'        // 结束
  };

  var state = {
    phase: GameState.READY,
    snake: [],        // 数组头在前：[{x, y}, ...]
    dir: Direction.RIGHT,   // 当前实际移动方向
    nextDir: Direction.RIGHT, // 输入缓冲方向（每步只应用一次，防连按反向）
    food: { x: 0, y: 0 },
    score: 0,
    best: 0,
    stepInterval: BASE_SPEED,
    accTime: 0,       // rAF 累积时间，用于固定步长更新
    lastTime: 0,
    rafId: 0
  };

  /* ============================================================
     四、工具函数
     ============================================================ */

  /** 读取最高分（localStorage 持久化） */
  function loadBest() {
    var v = 0;
    try { v = parseInt(localStorage.getItem(BEST_KEY), 10) || 0; } catch (e) { /* 隐私模式下忽略 */ }
    return v;
  }

  /** 保存最高分 */
  function saveBest(score) {
    try { localStorage.setItem(BEST_KEY, String(score)); } catch (e) { /* 忽略 */ }
  }

  /** 在空格子中随机放置食物（避开蛇身） */
  function spawnFood() {
    var occupied = {};
    for (var i = 0; i < state.snake.length; i++) {
      occupied[state.snake[i].x + ',' + state.snake[i].y] = true;
    }
    var free = [];
    for (var x = 0; x < GRID; x++) {
      for (var y = 0; y < GRID; y++) {
        if (!occupied[x + ',' + y]) free.push({ x: x, y: y });
      }
    }
    // 没有空格 = 蛇占满全场（通关），任意放一个即可触发胜利式结束
    state.food = free.length > 0
      ? free[Math.floor(Math.random() * free.length)]
      : { x: -1, y: -1 };
  }

  /* ============================================================
     五、游戏流程控制
     ============================================================ */

  /** 重置并开始一局新游戏 */
  function startGame() {
    // 按钮聚焦时按 Enter 会同时触发 keydown 与 click，失焦避免双重重启
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    var cx = Math.floor(GRID / 2);
    var cy = Math.floor(GRID / 2);
    state.snake = [
      { x: cx,     y: cy },
      { x: cx - 1, y: cy },
      { x: cx - 2, y: cy }
    ];
    state.dir = Direction.RIGHT;
    state.nextDir = Direction.RIGHT;
    state.score = 0;
    state.stepInterval = BASE_SPEED;
    state.accTime = 0;
    state.lastTime = 0;
    spawnFood();
    updateHud();

    startOverlay.classList.add('hidden');
    gameOverOverlay.classList.add('hidden');
    pauseOverlay.classList.add('hidden');
    recordTipEl.classList.add('hidden');

    state.phase = GameState.RUNNING;
    state.lastTime = performance.now();
    cancelAnimationFrame(state.rafId);
    state.rafId = requestAnimationFrame(loop);
  }

  /** 暂停 / 继续 */
  function togglePause() {
    if (state.phase === GameState.RUNNING) {
      state.phase = GameState.PAUSED;
      pauseOverlay.classList.remove('hidden');
    } else if (state.phase === GameState.PAUSED) {
      state.phase = GameState.RUNNING;
      pauseOverlay.classList.add('hidden');
      state.lastTime = performance.now(); // 重置计时基准，避免暂停期间累积步长
    }
  }

  /** 游戏结束：结算并处理最高分 */
  function gameOver() {
    state.phase = GameState.OVER;
    cancelAnimationFrame(state.rafId);

    var isRecord = state.score > state.best && state.score > 0;
    if (isRecord) {
      state.best = state.score;
      saveBest(state.best);
      recordTipEl.classList.remove('hidden');
    } else {
      recordTipEl.classList.add('hidden');
    }
    updateHud();

    finalScoreEl.textContent = state.score;
    finalBestEl.textContent = '最高分：' + state.best;
    gameOverOverlay.classList.remove('hidden');
  }

  /** 单步逻辑更新：移动蛇、判定碰撞、吃食物 */
  function step() {
    // 应用输入缓冲方向（保证一帧内多次按键不会 180 度反向）
    state.dir = state.nextDir;

    var head = state.snake[0];
    var nx = head.x + state.dir.x;
    var ny = head.y + state.dir.y;

    // 撞墙
    if (nx < 0 || nx >= GRID || ny < 0 || ny >= GRID) {
      gameOver();
      return;
    }
    // 撞自身（尾巴即将离开的格子不算：若这步不吃食物，尾尖会移走）
    var willEat = (nx === state.food.x && ny === state.food.y);
    var checkLen = willEat ? state.snake.length : state.snake.length - 1;
    for (var i = 0; i < checkLen; i++) {
      if (state.snake[i].x === nx && state.snake[i].y === ny) {
        gameOver();
        return;
      }
    }

    // 前进：新头入队
    state.snake.unshift({ x: nx, y: ny });

    if (willEat) {
      // 吃到食物：不删尾（增长）、加分、提速
      state.score += SCORE_PER_FOOD;
      state.stepInterval = Math.max(MIN_SPEED, state.stepInterval - SPEED_STEP);
      spawnFood();
      updateHud();
    } else {
      // 正常移动：删尾
      state.snake.pop();
    }

    // 蛇占满全场：胜利式结束
    if (state.snake.length >= GRID * GRID) {
      gameOver();
    }
  }

  /* ============================================================
     六、渲染
     ============================================================ */

  /** 绘制棋盘背景网格 */
  function drawBoard() {
    ctx.fillStyle = '#141829';
    ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
    ctx.lineWidth = 1;
    for (var i = 1; i < GRID; i++) {
      ctx.beginPath();
      ctx.moveTo(i * CELL + 0.5, 0);
      ctx.lineTo(i * CELL + 0.5, CANVAS_SIZE);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, i * CELL + 0.5);
      ctx.lineTo(CANVAS_SIZE, i * CELL + 0.5);
      ctx.stroke();
    }
  }

  /** 绘制食物（圆形 + 微光晕） */
  function drawFood() {
    if (state.food.x < 0) return; // 无空格占位
    var cx = state.food.x * CELL + CELL / 2;
    var cy = state.food.y * CELL + CELL / 2;
    ctx.save();
    ctx.shadowColor = 'rgba(255, 93, 115, 0.7)';
    ctx.shadowBlur = 12;
    ctx.fillStyle = '#ff5d73';
    ctx.beginPath();
    ctx.arc(cx, cy, CELL * 0.34, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  /** 绘制蛇身（渐进色：头部最亮，向尾部渐暗；头部带眼睛） */
  function drawSnake() {
    var len = state.snake.length;
    for (var i = len - 1; i >= 0; i--) {
      var seg = state.snake[i];
      var t = len === 1 ? 0 : i / (len - 1); // 0=头, 1=尾
      // 颜色插值：#7dffb2(头) → #2fbf71(体) → 更暗的尾
      var r = Math.round(125 + (34 - 125) * t);
      var g = Math.round(255 + (168 - 255) * t);
      var b = Math.round(178 + (95 - 178) * t);
      var pad = i === 0 ? 1 : 2; // 头部稍大一点
      ctx.fillStyle = 'rgb(' + r + ',' + g + ',' + b + ')';
      roundRect(seg.x * CELL + pad, seg.y * CELL + pad, CELL - pad * 2, CELL - pad * 2, 5);
      ctx.fill();
    }
    // 眼睛：根据移动方向画在头部
    var head = state.snake[0];
    var hx = head.x * CELL + CELL / 2;
    var hy = head.y * CELL + CELL / 2;
    var d = state.dir;
    // 垂直于移动方向的偏移，用来分出两只眼睛
    var ox = -d.y * CELL * 0.18;
    var oy = d.x * CELL * 0.18;
    var fx = d.x * CELL * 0.18; // 沿移动方向前移
    var fy = d.y * CELL * 0.18;
    ctx.fillStyle = '#0b1f16';
    ctx.beginPath();
    ctx.arc(hx + fx + ox, hy + fy + oy, 2.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(hx + fx - ox, hy + fy - oy, 2.2, 0, Math.PI * 2);
    ctx.fill();
  }

  /** 圆角矩形路径辅助 */
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function render() {
    drawBoard();
    drawFood();
    drawSnake();
  }

  /** 更新顶栏 HUD */
  function updateHud() {
    scoreEl.textContent = state.score;
    bestEl.textContent = state.best;
  }

  /* ============================================================
     七、主循环（requestAnimationFrame + 固定步长）
     ============================================================ */
  function loop(now) {
    state.rafId = requestAnimationFrame(loop);
    var delta = now - state.lastTime;
    state.lastTime = now;
    // 处理标签页切走后回来 delta 过大的情况
    if (delta > 500) delta = state.stepInterval;

    // 固定步长：仅在运行中累积时间（暂停期间不累积，防止恢复后多步连跳）
    if (state.phase === GameState.RUNNING) {
      state.accTime += delta;
      // while 防止低帧率设备丢步
      while (state.accTime >= state.stepInterval) {
        state.accTime -= state.stepInterval;
        step();
        if (state.phase !== GameState.RUNNING) break; // 本步触发了 game over
      }
    }

    render();
  }

  /* ============================================================
     八、输入处理
     ============================================================ */

  /** 设置下一步方向；拒绝与当前方向相反（180 度） */
  function setDirection(dir) {
    if (state.phase !== GameState.RUNNING) return;
    var cur = state.dir;
    if (dir.x === -cur.x && dir.y === -cur.y) return; // 反向禁止
    if (dir.x === state.nextDir.x && dir.y === state.nextDir.y) return; // 重复忽略
    state.nextDir = dir;
  }

  var keyMap = {
    ArrowUp: Direction.UP,    KeyW: Direction.UP,
    ArrowDown: Direction.DOWN, KeyS: Direction.DOWN,
    ArrowLeft: Direction.LEFT, KeyA: Direction.LEFT,
    ArrowRight: Direction.RIGHT, KeyD: Direction.RIGHT
  };

  document.addEventListener('keydown', function (e) {
    // 用 e.code，兼容 WASD 大小写及不同键盘布局
    if (keyMap[e.code]) {
      e.preventDefault(); // 阻止方向键滚动页面
      setDirection(keyMap[e.code]);
      return;
    }
    if (e.code === 'Space') {
      e.preventDefault();
      if (state.phase === GameState.RUNNING || state.phase === GameState.PAUSED) togglePause();
      return;
    }
    if (e.code === 'Enter') {
      if (state.phase === GameState.READY || state.phase === GameState.OVER) startGame();
    }
  });

  // ---------- 触屏滑动 ----------
  var touchStartX = 0;
  var touchStartY = 0;
  var SWIPE_THRESHOLD = 24; // 最小滑动距离（px）

  canvas.addEventListener('touchstart', function (e) {
    if (e.touches.length !== 1) return;
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    e.preventDefault();
  }, { passive: false });

  canvas.addEventListener('touchmove', function (e) {
    e.preventDefault();
  }, { passive: false });

  canvas.addEventListener('touchend', function (e) {
    if (e.changedTouches.length !== 1) return;
    var dx = e.changedTouches[0].clientX - touchStartX;
    var dy = e.changedTouches[0].clientY - touchStartY;
    if (Math.abs(dx) < SWIPE_THRESHOLD && Math.abs(dy) < SWIPE_THRESHOLD) return;
    // 取绝对位移更大的轴作为滑动方向
    if (Math.abs(dx) > Math.abs(dy)) {
      setDirection(dx > 0 ? Direction.RIGHT : Direction.LEFT);
    } else {
      setDirection(dy > 0 ? Direction.DOWN : Direction.UP);
    }
    e.preventDefault();
  }, { passive: false });

  // 移动端：双击画布在暂停/继续间切换
  var lastTapTime = 0;
  canvas.addEventListener('touchend', function (e) {
    // 滑动不视作点按，避免连续快速滑动时误触发暂停
    var tdx = e.changedTouches[0].clientX - touchStartX;
    var tdy = e.changedTouches[0].clientY - touchStartY;
    if (Math.abs(tdx) > SWIPE_THRESHOLD || Math.abs(tdy) > SWIPE_THRESHOLD) return;
    var now = Date.now();
    if (now - lastTapTime < 300) {
      // 双击：暂停/继续
      if (state.phase === GameState.RUNNING || state.phase === GameState.PAUSED) togglePause();
      lastTapTime = 0;
    } else {
      lastTapTime = now;
    }
  });

  // 暂停遮罩会盖住画布（拦截触屏事件），必须支持点击遮罩本身恢复，
  // 否则移动端暂停后将无任何途径继续
  pauseOverlay.addEventListener('click', function () {
    if (state.phase === GameState.PAUSED) togglePause();
  });

  // ---------- 按钮 ----------
  startBtn.addEventListener('click', startGame);
  restartBtn.addEventListener('click', startGame);

  /* ============================================================
     九、初始化
     ============================================================ */
  function init() {
    state.best = loadBest();
    updateHud();
    // 开始界面背后画一个静态初始棋盘，视觉不空白
    state.snake = [
      { x: 12, y: 12 }, { x: 11, y: 12 }, { x: 10, y: 12 }
    ];
    state.food = { x: 17, y: 9 };
    render();
  }

  init();
})();
</script>
</body>
</html>
