<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>打砖块</title>
<style>
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --border: #dfe3e8;
    --text: #1f2328;
    --muted: #6b7280;
    --accent: #3b6ef5;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    padding: 24px 16px 40px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }

  h1 { margin: 0 0 4px; font-size: 30px; letter-spacing: -.02em; }
  .tip { margin: 0 0 18px; font-size: 13px; color: var(--muted); text-align: center; }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    box-shadow: 0 1px 2px rgba(16,24,40,.05), 0 4px 12px rgba(16,24,40,.06);
  }

  .hud {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
    font-size: 14px;
  }
  .hud b { font-size: 16px; }
  .hud .right { display: flex; gap: 8px; align-items: center; }

  button {
    font-family: inherit;
    font-size: 13px;
    color: var(--text);
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 13px;
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }

  .stage { position: relative; }

  canvas {
    display: block;
    width: 100%;
    max-width: 480px;
    height: auto;
    border-radius: 8px;
    background: #10151f;
    touch-action: none;
  }

  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: rgba(16, 21, 31, .72);
    border-radius: 8px;
    color: #fff;
    text-align: center;
    padding: 20px;
  }
  #overlay.hide { display: none; }
  #overlay .msg { font-size: 26px; font-weight: 700; }
  #overlay .sub { font-size: 14px; color: #c7cedb; }
  #overlay button { color: #fff; background: var(--accent); border-color: var(--accent); padding: 10px 22px; font-weight: 700; }
</style>
</head>
<body>

<div class="lang-switch" data-lang-switch></div>

<h1 data-i18n="title"></h1>
<p class="tip" data-i18n-html="tip"></p>

<div class="panel">
  <div class="hud">
    <div><span data-i18n="score"></span> <b id="score">0</b></div>
    <div><span data-i18n="lives"></span> <b id="lives">3</b> · <span data-i18n="level"></span> <b id="level">1</b></div>
    <div class="right">
      <button id="btnPause" data-i18n="pause"></button>
      <button id="btnNew" data-i18n="restart"></button>
    </div>
  </div>

  <div class="stage">
    <canvas id="cv" width="480" height="320"></canvas>
    <div id="overlay">
      <div class="msg" id="ovMsg"></div>
      <div class="sub" id="ovSub"></div>
      <button id="ovBtn"></button>
    </div>
  </div>
</div>

<script src="../assets/i18n.js"></script>
<script>
(function () {
  'use strict';

  var T = LiteI18N.create({
    title:   { en: 'Breakout', zh: '打砖块' },
    tip: {
      en: 'Move the mouse / press ← → / drag your finger to steer the paddle<br>Keep the ball alive and clear every brick',
      zh: '鼠标移动 / ← → 键 / 手指拖动 控制挡板<br>挡住小球，打掉所有砖块'
    },
    score:   { en: 'Score', zh: '得分' },
    lives:   { en: 'Lives', zh: '生命' },
    level:   { en: 'Level', zh: '关卡' },
    pause:   { en: 'Pause', zh: '暂停' },
    resume:  { en: 'Resume', zh: '继续' },
    restart: { en: 'New game', zh: '重新开始' },
    ready:   { en: 'Ready?', zh: '准备好了吗？' },
    readySub:{ en: 'Press start, or hit space to launch', zh: '点击开始，或按空格发小球' },
    start:   { en: 'Start', zh: '开始游戏' },
    lvTitle: { en: 'Level {n}', zh: '第 {n} 关' },
    lvSub:   { en: 'The ball is faster now, stay sharp', zh: '球速变快了，小心点' },
    cont:    { en: 'Continue', zh: '继续' },
    paused:  { en: 'Paused', zh: '已暂停' },
    pausedSub:{ en: 'Click to resume', zh: '点击继续' },
    over:    { en: 'Game over', zh: '游戏结束' },
    overSub: { en: 'Final score {n}', zh: '最终得分 {n}' },
    again:   { en: 'Play again', zh: '再来一局' },
    clear:   { en: 'Level clear!', zh: '过关！' },
    clearSub:{ en: 'Score {n} — on to level {m}', zh: '得分 {n}，进入第 {m} 关' },
    next:    { en: 'Next level', zh: '下一关' }
  });

  var W = 480, H = 320;
  var PADDLE_W = 84, PADDLE_H = 10, PADDLE_Y = H - 26;
  var BALL_R = 6;
  var BRICK_ROWS = 5, BRICK_COLS = 9;
  var BRICK_W = 46, BRICK_H = 18, BRICK_GAP = 4;
  var BRICK_TOP = 46, BRICK_LEFT = 13;
  var MAX_LIVES = 3;
  var BASE_SPEED = 3.4;

  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');
  var scoreEl = document.getElementById('score');
  var livesEl = document.getElementById('lives');
  var levelEl = document.getElementById('level');
  var overlayEl = document.getElementById('overlay');
  var ovMsgEl = document.getElementById('ovMsg');
  var ovSubEl = document.getElementById('ovSub');
  var ovBtnEl = document.getElementById('ovBtn');
  var btnPause = document.getElementById('btnPause');

  // Row colors from top to bottom.
  var ROW_COLORS = ['#e24b4a', '#ef9f27', '#639922', '#378add', '#7f77dd'];

  var paddle, ball, bricks, score, lives, level, state, rafId;
  var overlayKind;   // which overlay is showing, so it can be re-translated
  var keys = { left: false, right: false };

  /* ---------- canvas scaling ---------- */

  function setupCanvas() {
    var dpr = window.devicePixelRatio || 1;
    cv.width = W * dpr;
    cv.height = H * dpr;
    cv.style.aspectRatio = W + ' / ' + H;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  /* ---------- level / entity setup ---------- */

  function buildBricks() {
    bricks = [];
    for (var r = 0; r < BRICK_ROWS; r++) {
      for (var c = 0; c < BRICK_COLS; c++) {
        bricks.push({
          x: BRICK_LEFT + c * (BRICK_W + BRICK_GAP),
          y: BRICK_TOP + r * (BRICK_H + BRICK_GAP),
          w: BRICK_W,
          h: BRICK_H,
          color: ROW_COLORS[r % ROW_COLORS.length],
          alive: true
        });
      }
    }
  }

  function speedForLevel() {
    return BASE_SPEED + (level - 1) * 0.45;
  }

  function resetRound() {
    paddle = { x: (W - PADDLE_W) / 2, y: PADDLE_Y, w: PADDLE_W, h: PADDLE_H };
    ball = { x: W / 2, y: PADDLE_Y - BALL_R - 1, vx: 0, vy: 0, r: BALL_R, stuck: true };
    buildBricks();
    draw();
  }

  function launchBall() {
    var speed = speedForLevel();
    var angle = -Math.PI / 3 - Math.random() * (Math.PI / 3);
    ball.vx = Math.cos(angle) * speed * (Math.random() < 0.5 ? 1 : -1);
    ball.vy = Math.sin(angle) * speed;
    ball.stuck = false;
  }

  function newGame() {
    score = 0;
    lives = MAX_LIVES;
    level = 1;
    resetRound();
    updateHud();
    showOverlay('ready');
    state = 'ready';
  }

  function nextLevel() {
    level++;
    resetRound();
    updateHud();
    showOverlay('level');
    state = 'ready';
  }

  /* ---------- hud / overlay ---------- */

  function updateHud() {
    scoreEl.textContent = score;
    livesEl.textContent = lives;
    levelEl.textContent = level;
  }

  // Overlay content is derived from the game state so it can be re-translated.
  function showOverlay(kind) {
    overlayKind = kind;
    var msg, sub, btn;

    if (kind === 'ready') { msg = T.t('ready'); sub = T.t('readySub'); btn = T.t('start'); }
    else if (kind === 'level') { msg = T.t('lvTitle', { n: level }); sub = T.t('lvSub'); btn = T.t('cont'); }
    else if (kind === 'paused') { msg = T.t('paused'); sub = T.t('pausedSub'); btn = T.t('cont'); }
    else if (kind === 'over') { msg = T.t('over'); sub = T.t('overSub', { n: score }); btn = T.t('again'); }
    else if (kind === 'cleared') { msg = T.t('clear'); sub = T.t('clearSub', { n: score, m: level + 1 }); btn = T.t('next'); }

    ovMsgEl.textContent = msg;
    ovSubEl.textContent = sub;
    ovBtnEl.textContent = btn;
    overlayEl.classList.remove('hide');
  }

  function hideOverlay() {
    overlayKind = null;
    overlayEl.classList.add('hide');
  }

  /* ---------- update ---------- */

  function update() {
    // Paddle movement from the keyboard.
    if (keys.left) paddle.x -= 6.5;
    if (keys.right) paddle.x += 6.5;
    paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));

    if (ball.stuck) {
      ball.x = paddle.x + paddle.w / 2;
      ball.y = PADDLE_Y - BALL_R - 1;
      return;
    }

    ball.x += ball.vx;
    ball.y += ball.vy;

    // Walls.
    if (ball.x - ball.r < 0) { ball.x = ball.r; ball.vx = -ball.vx; }
    if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.vx = -ball.vx; }
    if (ball.y - ball.r < 0) { ball.y = ball.r; ball.vy = -ball.vy; }

    // Paddle: reflect and add a little spin based on where it landed.
    if (ball.vy > 0 &&
        ball.y + ball.r >= paddle.y &&
        ball.y - ball.r <= paddle.y + paddle.h &&
        ball.x >= paddle.x - ball.r &&
        ball.x <= paddle.x + paddle.w + ball.r) {
      var hit = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
      hit = Math.max(-1, Math.min(1, hit));
      var speed = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
      var angle = -Math.PI / 2 + hit * (Math.PI / 3);
      ball.vx = Math.cos(angle) * speed;
      ball.vy = Math.sin(angle) * speed;
      ball.y = paddle.y - ball.r - 0.5;
    }

    // Bricks: resolve along the axis with the smaller overlap.
    for (var i = 0; i < bricks.length; i++) {
      var b = bricks[i];
      if (!b.alive) continue;
      if (ball.x + ball.r < b.x || ball.x - ball.r > b.x + b.w) continue;
      if (ball.y + ball.r < b.y || ball.y - ball.r > b.y + b.h) continue;

      b.alive = false;
      score += 10;

      var overlapX = Math.min(ball.x + ball.r - b.x, b.x + b.w - (ball.x - ball.r));
      var overlapY = Math.min(ball.y + ball.r - b.y, b.y + b.h - (ball.y - ball.r));
      if (overlapX < overlapY) ball.vx = -ball.vx;
      else ball.vy = -ball.vy;

      updateHud();
      break;   // one brick per frame keeps the bounce predictable
    }

    // Bottom edge: lose a life.
    if (ball.y - ball.r > H) {
      lives--;
      updateHud();
      if (lives <= 0) {
        state = 'over';
        showOverlay('over');
        return;
      }
      ball.stuck = true;
      return;
    }

    // Cleared the level.
    if (!bricks.some(function (b) { return b.alive; })) {
      state = 'cleared';
      showOverlay('cleared');
      cancelAnimationFrame(rafId);
      rafId = 0;
    }
  }

  /* ---------- draw ---------- */

  function draw() {
    ctx.clearRect(0, 0, W, H);

    // Bricks.
    bricks.forEach(function (b) {
      if (!b.alive) return;
      ctx.fillStyle = b.color;
      ctx.fillRect(b.x, b.y, b.w, b.h);
      ctx.fillStyle = 'rgba(255,255,255,.22)';
      ctx.fillRect(b.x, b.y, b.w, 3);
    });

    // Paddle.
    ctx.fillStyle = '#e9edf2';
    ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);

    // Ball.
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff';
    ctx.fill();
    ctx.closePath();
  }

  function loop() {
    if (state !== 'playing') return;
    update();
    if (state === 'playing') draw();
    if (state === 'playing') rafId = requestAnimationFrame(loop);
  }

  function start() {
    hideOverlay();
    state = 'playing';
    if (ball.stuck) launchBall();
    cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(loop);
  }

  function pause() {
    if (state !== 'playing') return;
    cancelAnimationFrame(rafId);
    rafId = 0;
    state = 'paused';
    showOverlay('paused');
  }

  /* ---------- input ---------- */

  function pointerX(clientX) {
    var rect = cv.getBoundingClientRect();
    return (clientX - rect.left) / rect.width * W;
  }

  function movePaddleTo(x) {
    paddle.x = Math.max(0, Math.min(W - paddle.w, x - paddle.w / 2));
    if (ball.stuck) {
      ball.x = paddle.x + paddle.w / 2;
      draw();
    }
  }

  cv.addEventListener('mousemove', function (ev) {
    movePaddleTo(pointerX(ev.clientX));
  });

  cv.addEventListener('touchstart', function (ev) {
    ev.preventDefault();
    movePaddleTo(pointerX(ev.touches[0].clientX));
  }, { passive: false });

  cv.addEventListener('touchmove', function (ev) {
    ev.preventDefault();
    movePaddleTo(pointerX(ev.touches[0].clientX));
  }, { passive: false });

  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'ArrowLeft') keys.left = true;
    if (ev.key === 'ArrowRight') keys.right = true;
    if (ev.key === ' ' || ev.key === 'Enter') {
      ev.preventDefault();
      if (state === 'ready' || state === 'paused') start();
    }
  });

  document.addEventListener('keyup', function (ev) {
    if (ev.key === 'ArrowLeft') keys.left = false;
    if (ev.key === 'ArrowRight') keys.right = false;
  });

  ovBtnEl.addEventListener('click', function () {
    if (state === 'over') newGame();
    else if (state === 'cleared') nextLevel();
    else start();
  });

  btnPause.addEventListener('click', function () {
    if (state === 'playing') { pause(); btnPause.textContent = T.t('resume'); }
    else if (state === 'paused') { start(); btnPause.textContent = T.t('pause'); }
  });

  document.getElementById('btnNew').addEventListener('click', function () {
    btnPause.textContent = T.t('pause');
    newGame();
  });

  cv.addEventListener('click', function () {
    if (state === 'ready') start();
  });

  window.addEventListener('resize', function () {
    setupCanvas();
    draw();
  });

  T.onChange(function () {
    if (overlayKind) showOverlay(overlayKind);
    btnPause.textContent = (state === 'paused') ? T.t('resume') : T.t('pause');
  });

  setupCanvas();
  T.start();
  newGame();
})();
</script>
</body>
</html>
