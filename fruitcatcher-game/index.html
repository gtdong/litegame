<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>接水果</title>
<style>
  :root {
    --bg: linear-gradient(180deg, #87ceeb 0%, #ffe5b4 100%);
    --panel: rgba(255,255,255,.85);
    --border: #d6c1a3;
    --text: #2d2418;
    --muted: #8a7a5e;
    --accent: #ff7043;
    --good: #2e7d32;
    --danger: #d32f2f;
    --basket: #b1732d;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    padding: 24px 16px 40px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    user-select: none;
    overflow-x: hidden;
  }

  h1 {
    margin: 0 0 14px;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }

  .lang-switch { margin-bottom: 12px; }

  .stage {
    position: relative;
    background: var(--panel);
    border: 2px solid var(--border);
    border-radius: 14px;
    box-shadow: 0 6px 20px rgba(120, 80, 30, .12);
    overflow: hidden;
    touch-action: none;
  }

  canvas { display: block; }

  .bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    max-width: 540px;
    margin: 12px auto 0;
    padding: 0 4px;
    color: var(--text);
    font-size: 16px;
    font-weight: 600;
  }

  .bar .right { display: flex; gap: 14px; align-items: center; }
  .bar button {
    border: 1px solid var(--border);
    background: #fff;
    color: var(--text);
    padding: 6px 14px;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
  }
  .bar button:hover { background: var(--accent); color: #fff; border-color: var(--accent); }

  .lives { color: var(--danger); }
  .lives.lost { opacity: .25; }

  .panel { width: 100%; max-width: 540px; display: flex; justify-content: center; }

  /* End-of-round dialog (overlays the canvas) */
  #overlay {
    position: absolute;
    inset: 0;
    background: rgba(45, 36, 24, .55);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 5;
    animation: fadeIn .25s ease-out;
  }
  #overlay.show { display: flex; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  #dialog {
    background: #fff;
    padding: 26px 32px;
    border-radius: 14px;
    min-width: 260px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,.25);
    animation: pop .25s ease-out;
  }
  @keyframes pop {
    from { transform: translateY(20px) scale(.95); opacity: 0; }
    to   { transform: translateY(0)    scale(1);   opacity: 1; }
  }
  #dialog h2 { margin: 0 0 8px; font-size: 22px; color: var(--text); }
  #dialog .big { font-size: 56px; font-weight: 800; color: var(--accent); margin: 6px 0 14px; line-height: 1; }
  #dialog .grade { font-size: 16px; margin-bottom: 14px; color: var(--muted); }
  #dialog .stats { display: flex; gap: 12px; justify-content: center; margin-bottom: 16px; font-size: 13px; color: var(--muted); }
  #dialog .stats div { background: #f7f1e6; padding: 6px 10px; border-radius: 8px; min-width: 84px; }
  #dialog .stats strong { color: var(--text); display: block; font-size: 18px; margin-top: 2px; }
  #dialog .actions { display: flex; gap: 10px; justify-content: center; }
  #dialog button {
    border: none;
    background: var(--accent);
    color: #fff;
    padding: 8px 18px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  #dialog button.secondary { background: #fff; color: var(--text); border: 1px solid var(--border); }
  #dialog button:hover { filter: brightness(1.05); }
</style>
</head>
<body>
  <h1 data-i18n="title">接水果</h1>
  <div class="lang-switch" data-lang-switch></div>
  <div class="panel">
    <div class="bar">
      <div>
        <span data-i18n="score">得分</span>: <strong id="scoreEl">0</strong>
        &nbsp;&nbsp;
        <span class="lives" data-i18n="lives">生命</span>: <strong id="livesEl">❤️❤️❤️</strong>
      </div>
      <div class="right">
        <span data-i18n="level">等级</span> <strong id="levelEl">1</strong>
        <button id="btnNew" data-i18n="new">新游戏</button>
      </div>
    </div>
  </div>

  <div class="stage" id="stage">
    <canvas id="game" width="540" height="380"></canvas>
    <div id="overlay">
      <div id="dialog">
        <h2 id="dlgTitle">时间到！</h2>
        <div class="big" id="dlgScore">0</div>
        <div class="grade" id="dlgGrade">再练练手</div>
        <div class="stats">
          <div><span data-i18n="caught">接到</span><strong id="dlgCaught">0</strong></div>
          <div><span data-i18n="dropped">漏掉</span><strong id="dlgDropped">0</strong></div>
          <div><span data-i18n="best">最高分</span><strong id="dlgBest">0</strong></div>
        </div>
        <div class="actions">
          <button id="btnAgain" data-i18n="playAgain">再玩一局</button>
          <button id="btnClose" class="secondary" data-i18n="close">关闭</button>
        </div>
      </div>
    </div>
  </div>

<script src="../assets/i18n.js"></script>
<script>
  'use strict';

  var T = LiteI18N.create({
    title:     { en: 'Fruit Catcher',          zh: '接水果' },
    score:     { en: 'Score',                  zh: '得分' },
    lives:     { en: 'Lives',                  zh: '生命' },
    level:     { en: 'Level',                  zh: '等级' },
    new:       { en: 'New',                    zh: '新游戏' },
    playAgain: { en: 'Play again',             zh: '再玩一局' },
    close:     { en: 'Close',                  zh: '关闭' },
    caught:    { en: 'Caught',                 zh: '接到' },
    dropped:   { en: 'Missed',                 zh: '漏掉' },
    best:      { en: 'Best',                   zh: '最高分' },
    over:     { en: 'Game over',               zh: '游戏结束' },
    perfect:  { en: 'Perfect harvest!',        zh: '完美丰收！' },
    great:    { en: 'Great catching!',         zh: '眼疾手快！' },
    nice:     { en: 'Nice work!',              zh: '手感不错！' },
    keepon:   { en: 'Keep practicing!',        zh: '再练练手' }
  });

  // ---------- canvas setup ----------
  var cvs = document.getElementById('game');
  var ctx = cvs.getContext('2d');
  var W = cvs.width, H = cvs.height;
  var DPR = window.devicePixelRatio || 1;
  if (DPR !== 1) {
    cvs.width = W * DPR; cvs.height = H * DPR;
    cvs.style.width = W + 'px'; cvs.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }

  // ---------- game state ----------
  var score = 0, lives = 3, level = 1;
  var best = +(localStorage.getItem('fruitcatcher_best') || 0);
  var items = [];        // { x, y, vy, kind, rot, spin }
  var particles = [];    // catch/burst visuals
  var basket = { x: W / 2, y: H - 40, height: 36, width: 90 };
  var spawnTimer = 0;
  var elapsed = 0;
  var running = false;
  var lastTs = 0;
  var pointerActive = false;
  var stats = { caught: 0, dropped: 0, bombs: 0 };

  var FRUITS = [
    { e: '🍎', s: 10, w: 1.0 },
    { e: '🍌', s: 12, w: 0.9 },
    { e: '🍇', s: 14, w: 0.8 },
    { e: '🍉', s: 16, w: 0.7 },
    { e: '🍑', s: 18, w: 0.55 },
    { e: '🍓', s: 20, w: 0.4 }
  ];
  var BOMB = { e: '💣', s: -1, w: 0.3 };

  // ---------- helpers ----------
  function rand(min, max) { return min + Math.random() * (max - min); }
  function pickKind() {
    // Fruits plus an increasingly large bomb pool as level grows.
    var pool = [];
    FRUITS.forEach(function (f) {
      for (var i = 0; i < Math.round(f.w * 10); i++) pool.push(f);
    });
    var bombWeight = Math.min(8, 2 + level);
    for (var j = 0; j < bombWeight; j++) pool.push(BOMB);
    return pool[(Math.random() * pool.length) | 0];
  }

  function spawn() {
    var kind = pickKind();
    var r = 22 + Math.random() * 8;
    items.push({
      x: rand(r + 4, W - r - 4),
      y: -r,
      vy: 90 + level * 12 + Math.random() * 18,
      r: r,
      kind: kind,
      rot: Math.random() * Math.PI * 2,
      spin: rand(-0.05, 0.05)
    });
  }

  // Catch sparkle particle
  function sparkle(x, y, color) {
    for (var i = 0; i < 8; i++) {
      var a = Math.random() * Math.PI * 2;
      var d = rand(20, 60);
      particles.push({
        x: x, y: y,
        vx: Math.cos(a) * d, vy: Math.sin(a) * d - 30,
        life: 1, decay: rand(1.8, 2.6),
        r: rand(2, 4),
        color: color
      });
    }
  }

  // Bomb explosion particles
  function boom(x, y) {
    var palette = ['#ffd54f', '#ff9100', '#ff3d00', '#b71c1c'];
    for (var i = 0; i < 18; i++) {
      var a = Math.random() * Math.PI * 2;
      var d = rand(40, 110);
      particles.push({
        x: x, y: y,
        vx: Math.cos(a) * d, vy: Math.sin(a) * d,
        life: 1, decay: rand(1.2, 2),
        r: rand(2, 5),
        color: palette[(Math.random() * palette.length) | 0],
        grav: 120
      });
    }
    // shock wave ring
    particles.push({
      ring: true, x: x, y: y, r: 8, grow: 220, life: 1, decay: 3.5
    });
    // shake the stage
    var stage = document.getElementById('stage');
    stage.classList.remove('shake');
    void stage.offsetWidth;
    stage.classList.add('shake');
  }

  // ---------- input ----------
  function setBasketX(clientX) {
    var rect = cvs.getBoundingClientRect();
    basket.x = Math.max(basket.width / 2, Math.min(W - basket.width / 2, clientX - rect.left));
  }

  cvs.addEventListener('mousemove', function (ev) {
    if (!running) return;
    setBasketX(ev.clientX);
  });
  cvs.addEventListener('touchmove', function (ev) {
    if (!running || !ev.touches[0]) return;
    setBasketX(ev.touches[0].clientX);
    ev.preventDefault();
  }, { passive: false });
  cvs.addEventListener('touchstart', function (ev) {
    pointerActive = true;
    if (ev.touches[0]) setBasketX(ev.touches[0].clientX);
    ev.preventDefault();
  }, { passive: false });
  cvs.addEventListener('mousedown', function (ev) { pointerActive = true; setBasketX(ev.clientX); });
  window.addEventListener('mouseup', function () { pointerActive = false; });

  var keys = {};
  window.addEventListener('keydown', function (ev) {
    var k = ev.key;
    keys[k] = true;
    if (k === ' ' || k === 'Enter') { ev.preventDefault(); togglePause(); }
    if (k === 'Escape') { closeDialog(); }
  });
  window.addEventListener('keyup', function (ev) { keys[ev.key] = false; });

  function processKeys(dt) {
    if (keys.ArrowLeft || keys.a)  basket.x -= 360 * dt;
    if (keys.ArrowRight || keys.d) basket.x += 360 * dt;
    basket.x = Math.max(basket.width / 2, Math.min(W - basket.width / 2, basket.x));
  }

  // ---------- update ----------
  function update(dt) {
    elapsed += dt;
    level = 1 + Math.floor(elapsed / 12);
    if (level > 99) level = 99;

    // Spawn cadence grows with level but stays sane.
    var interval = Math.max(0.35, 1.1 - level * 0.06);
    spawnTimer += dt;
    if (spawnTimer >= interval) { spawnTimer = 0; spawn(); }

    // Items fall
    for (var i = items.length - 1; i >= 0; i--) {
      var it = items[i];
      it.y += it.vy * dt;
      it.rot += it.spin;
      // Catch check: vertical overlap + horizontal overlap with basket mouth.
      var top = it.y + it.r;
      var basketTop = basket.y;
      var basketLeft = basket.x - basket.width / 2;
      var basketRight = basket.x + basket.width / 2;
      if (top >= basketTop && it.y - it.r < basketTop + basket.height &&
          it.x >= basketLeft && it.x <= basketRight) {
        if (it.kind === BOMB) {
          loseLife(it.x, basketTop);
        } else {
          catchFruit(it);
        }
        items.splice(i, 1);
        continue;
      }
      // Missed (off-screen at the bottom)
      if (it.y - it.r > H + 20) {
        if (it.kind !== BOMB) {
          // missing a fruit costs a life too
          loseLife(W / 2, H, true);
          stats.dropped++;
        }
        items.splice(i, 1);
      }
    }

    // Particles
    for (var p = particles.length - 1; p >= 0; p--) {
      var pa = particles[p];
      if (pa.ring) {
        pa.r += pa.grow * dt;
        pa.life -= pa.decay * dt;
      } else {
        pa.x += pa.vx * dt;
        pa.y += pa.vy * dt;
        if (pa.grav) pa.vy += pa.grav * dt;
        pa.vx *= 0.96; pa.vy *= 0.96;
        pa.life -= pa.decay * dt;
      }
      if (pa.life <= 0) particles.splice(p, 1);
    }
  }

  function catchFruit(it) {
    score += it.kind.s;
    stats.caught++;
    var palette = ['#ffd54f', '#ff9100', '#66bb6a', '#ef5350'];
    sparkle(it.x, it.y, palette[(Math.random() * palette.length) | 0]);
    updateHud();
  }

  function loseLife(x, y, silent) {
    lives--;
    stats.bombs++;
    if (!silent) boom(x, y);
    flashHud();
    updateHud();
    if (lives <= 0) endGame();
  }

  // ---------- render ----------
  function drawBasket() {
    var bx = basket.x - basket.width / 2;
    var by = basket.y;
    var bw = basket.width;
    var bh = basket.height;

    ctx.fillStyle = 'rgba(0,0,0,0.15)';
    ctx.beginPath();
    ctx.ellipse(basket.x, by + bh - 2, bw / 2 + 6, 6, 0, 0, Math.PI * 2);
    ctx.fill();

    var grad = ctx.createLinearGradient(bx, by, bx, by + bh);
    grad.addColorStop(0, '#d4a373');
    grad.addColorStop(0.6, '#b1732d');
    grad.addColorStop(1, '#8a5a23');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(bx + 6, by);
    ctx.lineTo(bx + bw - 6, by);
    ctx.lineTo(bx + bw - 2, by + bh - 10);
    ctx.quadraticCurveTo(bx + bw / 2, by + bh + 6, bx + 2, by + bh - 10);
    ctx.closePath();
    ctx.fill();

    // weave pattern
    ctx.strokeStyle = 'rgba(255, 220, 170, .55)';
    ctx.lineWidth = 1.5;
    for (var yy = by + 6; yy < by + bh - 4; yy += 6) {
      ctx.beginPath();
      ctx.moveTo(bx + 4, yy);
      ctx.lineTo(bx + bw - 4, yy);
      ctx.stroke();
    }
    for (var xx = bx + 10; xx < bx + bw; xx += 12) {
      ctx.beginPath();
      ctx.moveTo(xx, by + 4);
      ctx.lineTo(xx, by + bh - 6);
      ctx.stroke();
    }
  }

  function drawItem(it) {
    ctx.save();
    ctx.translate(it.x, it.y);
    ctx.rotate(it.rot);
    ctx.font = (it.r * 1.6) + 'px serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(it.kind.e, 0, 2);
    ctx.restore();
  }

  function drawParticles() {
    for (var i = 0; i < particles.length; i++) {
      var pa = particles[i];
      if (pa.ring) {
        ctx.strokeStyle = 'rgba(255, 180, 50, ' + Math.max(0, pa.life) + ')';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(pa.x, pa.y, pa.r, 0, Math.PI * 2);
        ctx.stroke();
      } else {
        ctx.fillStyle = pa.color;
        ctx.globalAlpha = Math.max(0, pa.life);
        ctx.beginPath();
        ctx.arc(pa.x, pa.y, pa.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }
    }
  }

  function drawCloud(t) {
    // Cheerful background clouds drifting slowly.
    ctx.save();
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = '#fff';
    function cloud(cx, cy, s) {
      ctx.beginPath();
      ctx.arc(cx, cy, 18 * s, 0, Math.PI * 2);
      ctx.arc(cx + 18 * s, cy + 4, 22 * s, 0, Math.PI * 2);
      ctx.arc(cx + 38 * s, cy, 18 * s, 0, Math.PI * 2);
      ctx.fill();
    }
    var drift = (t * 8) % (W + 80);
    cloud(-80 + drift, 40, 1);
    cloud(W - 60 - drift * 0.7, 80, 0.7);
    cloud(W * 0.6 - drift * 0.5, 30, 0.9);
    ctx.restore();
  }

  function render(t) {
    ctx.clearRect(0, 0, W, H);
    drawCloud(t);
    drawBasket();
    for (var i = 0; i < items.length; i++) drawItem(items[i]);
    drawParticles();
  }

  // ---------- HUD ----------
  var scoreEl = document.getElementById('scoreEl');
  var livesEl = document.getElementById('livesEl');
  var levelEl = document.getElementById('levelEl');
  function updateHud() {
    scoreEl.textContent = String(score);
    livesEl.textContent = lives > 0 ? '❤️'.repeat(lives) + '🖤'.repeat(0) : '🖤🖤🖤';
    if (lives <= 0) livesEl.classList.add('lost'); else livesEl.classList.remove('lost');
    levelEl.textContent = String(level);
  }

  function flashHud() {
    livesEl.style.transition = '';
    livesEl.style.color = '#fff';
    livesEl.style.background = 'var(--danger)';
    setTimeout(function () {
      livesEl.style.transition = 'color .4s, background .4s';
      livesEl.style.color = '';
      livesEl.style.background = '';
    }, 60);
  }

  // ---------- loop ----------
  function loop(ts) {
    if (!lastTs) lastTs = ts;
    var dt = Math.min(0.05, (ts - lastTs) / 1000);
    lastTs = ts;

    if (running) {
      processKeys(dt);
      update(dt);
    }
    render(ts / 1000);
    requestAnimationFrame(loop);
  }

  // ---------- game lifecycle ----------
  function newGame() {
    closeDialog();
    score = 0; lives = 3; level = 1;
    items.length = 0; particles.length = 0;
    elapsed = 0; spawnTimer = 0;
    stats = { caught: 0, dropped: 0, bombs: 0 };
    basket.x = W / 2;
    running = true;
    updateHud();
  }

  function endGame() {
    running = false;
    if (score > best) {
      best = score;
      try { localStorage.setItem('fruitcatcher_best', String(best)); } catch (e) {}
    }
    showDialog();
  }

  function togglePause() {
    if (lives <= 0) return;
    running = !running;
  }

  // ---------- dialog ----------
  var overlay = document.getElementById('overlay');
  var dlgScore = document.getElementById('dlgScore');
  var dlgCaught = document.getElementById('dlgCaught');
  var dlgDropped = document.getElementById('dlgDropped');
  var dlgBest = document.getElementById('dlgBest');
  var dlgGrade = document.getElementById('dlgGrade');
  var dlgTitle = document.getElementById('dlgTitle');

  function showDialog() {
    dlgTitle.textContent = T.t('over');
    dlgScore.textContent = String(score);
    dlgCaught.textContent = String(stats.caught);
    dlgDropped.textContent = String(stats.dropped);
    dlgBest.textContent = String(best);
    dlgGrade.textContent =
      score >= 300 ? T.t('perfect') :
      score >= 150 ? T.t('great') :
      score >= 50  ? T.t('nice') : T.t('keepon');
    overlay.classList.add('show');
  }

  function closeDialog() {
    overlay.classList.remove('show');
  }

  overlay.addEventListener('click', function (ev) {
    if (ev.target === overlay) closeDialog();
  });
  document.getElementById('btnAgain').addEventListener('click', newGame);
  document.getElementById('btnClose').addEventListener('click', closeDialog);
  document.getElementById('btnNew').addEventListener('click', newGame);

  T.onChange(function () {
    if (overlay.classList.contains('show')) {
      dlgTitle.textContent = T.t('over');
      dlgGrade.textContent =
        score >= 300 ? T.t('perfect') :
        score >= 150 ? T.t('great') :
        score >= 50  ? T.t('nice') : T.t('keepon');
    }
  });

  // ---------- init ----------
  buildFieldPlaceholder();
  function buildFieldPlaceholder() {
    // Used by the harness to detect a stage element; no real setup needed.
    document.getElementById('stage').dataset.ready = '1';
  }

  updateHud();
  T.start();
  // The canvas loop starts even before newGame(), so the empty stage renders nicely.
  requestAnimationFrame(loop);
</script>
</body>
</html>
